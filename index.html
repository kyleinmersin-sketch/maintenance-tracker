  async confirmImport() {
    const state = AppState.ui.importState;
    const config = IMPORT_CONFIGS[state.entityType];
    const validRows = (state.rows || []).filter((r) => r.valid);
    if (!validRows.length) return;
    const btn = document.querySelector('[data-action="confirmImport"]');
    if (btn) btn.disabled = true;
    try {
      const payloads = validRows.map((r) => r.payload);
      const chunkSize = 500;
      let imported = 0;
      for (let i = 0; i < payloads.length; i += chunkSize) {
        const chunk = payloads.slice(i, i + chunkSize);
        await DataLayer.withRetry(() => DataLayer.safeInsert(config.table, chunk, { multiple: true }));
        imported += chunk.length;
      }
      const skipped = (state.rows || []).length - validRows.length;
      AppState.cache = {};
      if (state.entityType === 'trucks') await AppState.trucks.load();
      if (state.entityType === 'trailers') await AppState.trailers.load();
      if (state.entityType === 'drivers') await AppState.drivers.load();
      // Only now — after the rows are actually in the database — mark the
      // source inbox file (if this import was launched from the Inbox) as
      // filed. Marking it any earlier is what let the Inbox show "Filed"
      // for imports that were never actually confirmed.
      if (state.sourceInboxId) {
        try {
          await DataLayer.withRetry(() => DataLayer.safeUpdate('file_inbox', state.sourceInboxId, { status: 'filed', filed_parent_table: config.table, reviewed_at: new Date().toISOString() }));
          await AppState.fileInbox.load();
        } catch (err) {
          console.error('[import] failed to mark source inbox file as filed', err);
        }
        state.sourceInboxId = null;
      }
      state.result = { imported, skipped };
      state.rows = null;
      state.error = null;
      render();
    } catch (err) {
      console.error(err);
      state.error = I18n.t('import_insert_failed');
      render();
    }
  },

  // ---- Mileage: driven-in-a-selected-period calculator (TZ §2) ------------
  async calcMileagePeriod(el) {
    const truckId = el.dataset.truckId;
    const wrap = el.closest('[data-role="mileage-period-calc"]');
    const from = wrap.querySelector('[data-role="period-from"]').value;
    const to = wrap.querySelector('[data-role="period-to"]').value;
    if (!from || !to) return;
    let rows = AppState.cache && AppState.cache['mileage:' + truckId];
    if (!rows || rows.__error) rows = await DataQueries.mileageLogs(truckId);
    const inRange = rows.filter((r) => !r.voided_at && r.reading_date >= from && r.reading_date <= to);
    let result = null;
    if (inRange.length >= 2) {
      const mileages = inRange.map((r) => r.mileage);
      result = Math.max(...mileages) - Math.min(...mileages);
    } else if (inRange.length === 1) {
      // A single reading inside the window still yields a result if there's
      // a prior reading just before it to measure from.
      const before = rows
        .filter((r) => !r.voided_at && r.reading_date < from)
        .sort((a, b) => new Date(b.reading_date) - new Date(a.reading_date))[0];
      result = before ? inRange[0].mileage - before.mileage : null;
    }
    AppState.ui.mileagePeriodByTruck[truckId] = { from, to, result };
    render();
  },

  async handleInboxFilesSelected(el) {

  // Shared by both ways files get into the inbox: the "Add files" picker
  // (handleInboxFilesSelected above) and dropping files onto the
  // [data-role="inbox-dropzone"] box (onDelegatedDrop below). Classifying
  // is sequential rather than Promise.all'd so files show up in the
  // pending list roughly in drop order and a slow Gemini call on one file
  // doesn't block the render() that shows the next one arriving.
  async handleInboxFiles(files) {
    if (!files.length) return;
    AppState.ui.inboxUploading = true;
    render();
    for (const file of files) {
      try {
        await InboxPipeline.uploadAndClassify(file);
      } catch (err) {
        console.error('[inbox] upload/classify failed', err);
      }
    }
    AppState.ui.inboxUploading = false;
    await AppState.fileInbox.load();
    render();
  },

  openInboxReviewForm(el) {
    const row = (AppState.fileInbox.rows || []).find((r) => r.id === el.dataset.id);
    if (!row) return;
    openModal(ModalForms.inboxReviewForm(row));

  async ignoreInboxFile(el) {

      await DataLayer.withRetry(() => DataLayer.safeUpdate('file_inbox', el.dataset.id, { status: 'ignored', reviewed_at: new Date().toISOString() }));
      await AppState.fileInbox.load();

    } catch (err) {

  },

  // Routes a staged spreadsheet straight into the existing bulk-import flow
  // instead of a maintenance-entry form — re-downloads the file from Storage
  // (DataLayer.safeDownload) rather than asking the user to pick it again.
  async openInboxAsImport(el) {
    const row = (AppState.fileInbox.rows || []).find((r) => r.id === el.dataset.id);
    if (!row) return;
    try {
      const { data: blob } = await DataLayer.withRetry(() => DataLayer.safeDownload('attachments', row.storage_path));
      const file = new File([blob], row.file_name, { type: row.file_type || '' });
      const rawRows = await parseSpreadsheetFile(file);
      AppState.ui.importState.entityType = row.suggested_import_entity || 'maintenance_entries';
      // Don't mark this inbox row "filed" yet — that only happens once
      // confirmImport() actually inserts the rows. Just remember which
      // inbox row this preview came from so confirmImport can close the loop.
      AppState.ui.importState.sourceInboxId = row.id;
      applyImportPreview(rawRows);
      closeModal();
      navigate('#/settings/import');
    } catch (err) {
      console.error('[inbox] open as import failed', err);
      alert(I18n.t('import_parse_failed'));
    }
  },
};

  // Odometer sanity check: a lower-than-last or implausibly large jump warns
  // and asks for explicit confirmation instead of silently saving or hard-
  // blocking — the last log for this truck might genuinely be wrong, or this
  // one might be, and only the person entering it can tell which.
  async mileageForm(form) {
    const truckId = form.dataset.truckId;
    const data = new FormData(form);
    const newMileage = Number(data.get('mileage'));
    const warnEl = form.querySelector('[data-role="odometer-warning"]');

    if (form.dataset.confirmed !== '1') {
      try {
        const { data: lastRows } = await DataLayer.safeSelect('mileage_logs', (q) =>
          q
            .eq('truck_id', truckId)
            .is('voided_at', null)
            .order('reading_date', { ascending: false })
            .order('created_at', { ascending: false })
            .limit(1)
        );
        const last = lastRows && lastRows[0];
        if (last) {
          const delta = newMileage - last.mileage;
          let msg = null;
          if (delta < 0) {
            msg = I18n.t('odometer_warning_lower', { last: last.mileage.toLocaleString(), date: fmtDate(last.reading_date) });
          } else if (delta > 5000) {
            msg = I18n.t('odometer_warning_jump', { delta: delta.toLocaleString(), last: last.mileage.toLocaleString(), date: fmtDate(last.reading_date) });
          }
          if (msg && warnEl) {
            warnEl.hidden = false;
            warnEl.innerHTML = `<strong>${esc(I18n.t('odometer_warning_title'))}</strong><p>${esc(msg)}</p>
              <button type="button" class="btn btn-secondary" data-action="confirmMileageAnyway">${esc(I18n.t('odometer_confirm_anyway'))}</button>`;
            return;
          }
        }
      } catch (e) {
        console.warn('Odometer sanity check failed to run — proceeding without it', e);
      }
    }

    const row = {
      truck_id: truckId,
      reading_date: data.get('reading_date'),
      mileage: newMileage,
      driver_name: data.get('driver_name') || null,
      note: data.get('note') || null,
      created_by: AppState.profile ? AppState.profile.id : null,
    };
    setFormStatus(form, 'saving');
    try {
      await DataLayer.withRetry(() => DataLayer.safeInsert('mileage_logs', row));
      invalidateCache('mileage:' + truckId);
      invalidateCache('truckMileage');
      invalidateCache('costPerMile');
      invalidateCache('lastEntryByType');
      closeModal();
      render();
    } catch (err) {
      console.error(err);
      setFormStatus(form, 'error');
    }
  },

    const path = `${parentTable}/${parentId}/${Date.now()}_${slugFileName(file.name)}`;
    await DataLayer.withRetry(() => DataLayer.safeUpload('attachments', path, file));

  },
};

// ============================================================================
// Gemini OCR
// ============================================================================
const GeminiOcr = {
  async extract(file) {
    if (!CONFIG.GEMINI_API_KEY) throw new Error('Gemini API key not configured');
    const base64 = await fileToBase64(file);
    const prompt =
      'You are reading a maintenance invoice, receipt, or photo of paperwork for a truck/trailer repair. ' +
      'Extract the total cost, the date of service, and the vendor/shop name if visible. ' +
      'Respond with ONLY compact JSON, no markdown, no prose, in this exact shape: ' +
      '{"cost": number_or_null, "date": "YYYY-MM-DD"_or_null, "vendor": string_or_null}';

    const resp = await fetch(
      `https://generativelanguage.googleapis.com/v1beta/models/${CONFIG.GEMINI_MODEL}:generateContent?key=${CONFIG.GEMINI_API_KEY}`,
      {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          contents: [{ parts: [{ text: prompt }, { inline_data: { mime_type: file.type, data: base64 } }] }],
          generationConfig: { temperature: 0 },
        }),
      }
    );
    if (!resp.ok) throw new Error('Gemini request failed: ' + resp.status);
    const json = await resp.json();
    const text = json.candidates && json.candidates[0] && json.candidates[0].content.parts[0].text;
    if (!text) throw new Error('Empty Gemini response');
    const cleaned = text.replace(/```json|```/g, '').trim();
    return JSON.parse(cleaned);
  },

  // Richer variant for the smart file inbox: also asks for a description,
  // a category hint, and a VIN, so the inbox can suggest both a unit AND a
  // maintenance category, not just fill in a cost. Same manual-fallback
  // rule as extract() — a failed/empty result never blocks filing, it just
  // means the reviewer fills the form in by hand.
  async extractForInbox(file) {
    if (!CONFIG.GEMINI_API_KEY) throw new Error('Gemini API key not configured');
    const base64 = await fileToBase64(file);
    const prompt =
      'You are reading a maintenance invoice, receipt, work order, or photo of paperwork for a truck/trailer repair or service. ' +
      'Extract as much of the following as you can find. Respond with ONLY compact JSON, no markdown, no prose, in this exact shape: ' +
      '{"cost": number_or_null, "date": "YYYY-MM-DD"_or_null, "vendor": string_or_null, "description": string_or_null, ' +
      '"category_hint": string_or_null, "vin": string_or_null}. ' +
      'category_hint should be a short maintenance category such as "Engine Oil Change", "Brake Pads/Brake System", "Tires", ' +
      'or "Other Repair" if the type of work is unclear.';
    const resp = await fetch(
      `https://generativelanguage.googleapis.com/v1beta/models/${CONFIG.GEMINI_MODEL}:generateContent?key=${CONFIG.GEMINI_API_KEY}`,
      {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          contents: [{ parts: [{ text: prompt }, { inline_data: { mime_type: file.type, data: base64 } }] }],
          generationConfig: { temperature: 0 },
        }),
      }
    );
    if (!resp.ok) throw new Error('Gemini request failed: ' + resp.status);
    const json = await resp.json();
    const text = json.candidates && json.candidates[0] && json.candidates[0].content.parts[0].text;
    if (!text) throw new Error('Empty Gemini response');
    return JSON.parse(text.replace(/```json|```/g, '').trim());
  },

  // Text-only counterpart to extractForInbox(), used for Word documents
  // (extractDocxText() pulls the plain text out first — there's no image
  // to send Gemini for a .docx).
  async extractFromText(text) {
    if (!CONFIG.GEMINI_API_KEY) throw new Error('Gemini API key not configured');
    if (!text) throw new Error('No text to extract from');
    const prompt =
      'The following text was extracted from a maintenance/repair document for a truck or trailer fleet. ' +
      'Extract cost, date, vendor, description, category_hint, and vin if present. Respond with ONLY compact JSON: ' +
      '{"cost": number_or_null, "date": "YYYY-MM-DD"_or_null, "vendor": string_or_null, "description": string_or_null, ' +
      '"category_hint": string_or_null, "vin": string_or_null}\n\nTEXT:\n' +
      text.slice(0, 6000);
    const resp = await fetch(
      `https://generativelanguage.googleapis.com/v1beta/models/${CONFIG.GEMINI_MODEL}:generateContent?key=${CONFIG.GEMINI_API_KEY}`,
      {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ contents: [{ parts: [{ text: prompt }] }], generationConfig: { temperature: 0 } }),
      }
    );
    if (!resp.ok) throw new Error('Gemini request failed: ' + resp.status);
    const json = await resp.json();
    const text2 = json.candidates && json.candidates[0] && json.candidates[0].content.parts[0].text;
    if (!text2) throw new Error('Empty Gemini response');
    return JSON.parse(text2.replace(/```json|```/g, '').trim());
  },
};

// ============================================================================
// Smart file inbox — classification helpers + pipeline
// ----------------------------------------------------------------------------
// Design mirrors the rest of the app's AI-assisted features: every guess
// here is a SUGGESTION shown for human review (Actions.openInboxReviewForm /
// ModalForms.inboxReviewForm), never auto-filed. A file with zero successful
// extraction still lands in the inbox with no suggestion — manual entry
// always works, the same rule GeminiOcr.extract() already follows for the
// per-record OCR button.
// ============================================================================
const _loadedScripts = {};
function loadScriptOnce(url) {
  if (!_loadedScripts[url]) {
    _loadedScripts[url] = new Promise((resolve, reject) => {
      const script = document.createElement('script');
      script.src = url;
      script.onload = () => resolve();
      script.onerror = () => reject(new Error('Failed to load ' + url));
      document.head.appendChild(script);
    });
  }
  return _loadedScripts[url];
}

// A .docx file is a zip of XML parts. This pulls word/document.xml out and
// strips tags rather than pulling in a full docx parser — enough text to
// feed the same regex/Gemini extraction used for everything else in the
// inbox. JSZip is loaded lazily (same CDN-on-demand pattern as XLSX/jsPDF
// already use elsewhere in this app) since most orgs will never upload a
// Word file and shouldn't pay for the library otherwise.
async function extractDocxText(file) {
  await loadScriptOnce('https://cdn.jsdelivr.net/npm/jszip@3.10.1/dist/jszip.min.js');
  const buf = await file.arrayBuffer();
  const zip = await JSZip.loadAsync(buf);
  const doc = zip.file('word/document.xml');
  if (!doc) return '';
  const xml = await doc.async('string');
  return xml
    .replace(/<w:p[ >]/g, '\n')
    .replace(/<[^>]+>/g, ' ')
    .replace(/\s+/g, ' ')
    .trim();
}

// .heic/.heif photos (the default iPhone camera format) often carry an
// empty or non-standard file.type in some browsers, so detection falls
// back to the extension the same way spreadsheets/PDFs already do below.
// .txt and .eml are plain text and grouped with .doc/.docx under
// 'document' — extractTextForClassification() below reads each format
// appropriately once a file lands in that bucket.
function detectedKindFor(file) {
  const name = (file.name || '').toLowerCase();
  const type = file.type || '';
  if (type.includes('spreadsheet') || /\.(xlsx|xls|csv)$/.test(name)) return 'spreadsheet';
  if (type === 'application/pdf' || name.endsWith('.pdf')) return 'pdf';
  if (type.startsWith('image/') || /\.(heic|heif)$/.test(name)) return 'image';
  if (type.includes('word') || /\.(docx|doc|txt|eml|msg)$/.test(name)) return 'document';
  return 'other';
}

// Generalizes what used to be a direct extractDocxText() call so the
// 'document' bucket (now .doc/.docx/.txt/.eml/.msg) can pull text out of
// each format appropriately:
//  - .docx: unzipped via extractDocxText (existing behavior, unchanged)
//  - .txt/.eml: plain text — File.text() reads it directly, headers and
//    all, which is enough for the date/cost/VIN regexes and Gemini's own
//    text extraction to work with
//  - .doc (legacy binary Word) / .msg (Outlook's binary compound-file
//    format): NOT parsed. Both are binary formats a browser can't safely
//    unzip or decode without a real parser library, and adding one just
//    for this is out of scope — the file still lands in the inbox (with
//    detected_kind 'document') and can always be filed manually, the same
//    "extraction failing never blocks filing" rule the rest of this
//    pipeline already follows.
async function extractTextForClassification(file) {
  const name = (file.name || '').toLowerCase();
  if (name.endsWith('.docx')) {
    try {
      return await extractDocxText(file);
    } catch (e) {
      console.warn('[inbox] docx text extraction failed', e);
      return '';
    }
  }
  if (name.endsWith('.txt') || name.endsWith('.eml')) {
    try {
      return await file.text();
    } catch (e) {
      console.warn('[inbox] plain-text extraction failed', e);
      return '';
    }
  }
  // .doc and .msg: no in-browser parser for these binary formats.
  return '';
}

// Cheap regex fallback for when there's no Gemini key (or Gemini fails):
// a date, a dollar total, and a 17-character VIN are the three signals
// that show up in almost any invoice/receipt text verbatim.
function extractSignalsFromText(text) {
  const result = { date: null, cost: null, vin: null };
  if (!text) return result;
  const dateMatch = text.match(/\b(\d{4}-\d{2}-\d{2})\b/) || text.match(/\b(\d{1,2}\/\d{1,2}\/\d{2,4})\b/);
  if (dateMatch) result.date = importParseDate(dateMatch[1]);
  const costMatch = text.match(/(?:total|amount due|balance)[:\s]*\$?\s?([\d,]+\.\d{2})/i) || text.match(/\$\s?([\d,]+\.\d{2})/);
  if (costMatch) {
    const n = Number(costMatch[1].replace(/,/g, ''));
    if (!isNaN(n)) result.cost = n;
  }
  const vinMatch = text.match(/\b([A-HJ-NPR-Z0-9]{17})\b/i); // standard VIN charset excludes I/O/Q
  if (vinMatch) result.vin = vinMatch[1].toUpperCase();
  return result;
}

function findUnitByVin(vin) {
  if (!vin) return null;
  const v = vin.trim().toUpperCase();
  const allUnits = [
    ...AppState.trucks.rows.map((u) => ({ ...u, unit_type: 'truck' })),
    ...AppState.trailers.rows.map((u) => ({ ...u, unit_type: 'trailer' })),
  ];
  return allUnits.find((u) => u.vin && u.vin.trim().toUpperCase() === v) || null;
}

function guessUnitFromText(text) {
  if (!text) return null;
  const byVin = findUnitByVin(extractSignalsFromText(text).vin);
  if (byVin) return byVin;
  const lower = text.toLowerCase();
  const allUnits = [
    ...AppState.trucks.rows.map((u) => ({ ...u, unit_type: 'truck' })),
    ...AppState.trailers.rows.map((u) => ({ ...u, unit_type: 'trailer' })),
  ];
  return allUnits.find((u) => u.name && lower.includes(u.name.toLowerCase())) || null;
}

// Matches free text against the org's own maintenance-type names — checks
// for the category's full name first (catches a Gemini category_hint like
// "Engine Oil Change" outright), then falls back to a looser word-overlap
// match, and finally to "Other Repair" so there's always something to show
// (the reviewer can always change it — this is a suggestion, not a verdict).
// Returns { type, strength } — strength is 'exact', 'token', or 'fallback'
// — so classifyInboxFile() can weigh this against a component-type guess
// (see guessComponentTypeFromText) instead of always preferring one.
function guessCategoryFromText(text, unitType) {
  const lower = (text || '').toLowerCase();
  const types = maintenanceTypesFor(unitType);
  const exact = types.find((mt) => {
    const name = (mt.name_en || '').toLowerCase();
    return name && lower.includes(name);
  });
  if (exact) return { type: exact, strength: 'exact' };
  const tokenMatch = types.find((mt) => {
    const name = (mt.name_en || '').toLowerCase();
    return name && name.split(/[\s/]+/).some((word) => word.length > 3 && lower.includes(word));
  });
  if (tokenMatch) return { type: tokenMatch, strength: 'token' };
  const fallback = types.find((mt) => (mt.name_en || '').toLowerCase() === 'other repair') || null;
  return fallback ? { type: fallback, strength: 'fallback' } : null;
}

// Same idea as guessCategoryFromText, but against the org's tracked
// component catalog (engine, brakes, batteries, ...) instead of
// maintenance types — and deliberately has NO fallback entry: there's no
// generic "Other component" catch-all the way "Other Repair" exists for
// maintenance, so a weak/no match here just means "not a component
// suggestion" rather than a low-confidence guess dressed up as one.
function guessComponentTypeFromText(text, unitType) {
  const lower = (text || '').toLowerCase();
  const types = componentTypesFor(unitType);
  const exact = types.find((ct) => {
    const name = (ct.name_en || '').toLowerCase();
    return name && lower.includes(name);
  });
  if (exact) return { type: exact, strength: 'exact' };
  const tokenMatch = types.find((ct) => {
    const name = (ct.name_en || '').toLowerCase();
    return name && name.split(/[\s/]+/).some((word) => word.length > 3 && lower.includes(word));
  });
  if (tokenMatch) return { type: tokenMatch, strength: 'token' };
  return null;
}

// For a staged spreadsheet: reuses the bulk-import column matcher itself
// (resolveImportColumns) to score the header row against every
// IMPORT_CONFIGS entity and pick whichever one is missing the fewest
// required columns — the same logic that decides whether an import preview
// row is valid, just used here to pick which entity a file's headers look
// like before the user ever sees a form.
async function guessImportEntityFromSpreadsheet(file) {
  try {
    const rawRows = await parseSpreadsheetFile(file);
    if (!rawRows.length) return 'maintenance_entries';
    const headerRow = rawRows[0];
    let best = 'maintenance_entries';
    let bestScore = -1;
    Object.keys(IMPORT_CONFIGS).forEach((key) => {
      const config = IMPORT_CONFIGS[key];
      const { missing } = resolveImportColumns(config, headerRow);
      const totalRequired = config.columns.filter((c) => c.required).length;
      const score = totalRequired - missing.length;
      if (score > bestScore) {
        bestScore = score;
        best = key;
      }
    });
    return best;
  } catch (e) {
    return 'maintenance_entries';
  }
}

async function classifyInboxFile(file) {
  const detectedKind = detectedKindFor(file);
  const result = {
    detectedKind,
    extracted: null,
    suggestedUnit: null,
    suggestedCategory: null,
    suggestedComponentType: null,
    suggestedTarget: 'maintenance',
    suggestedImportEntity: null,
  };

  if (detectedKind === 'spreadsheet') {
    result.suggestedImportEntity = await guessImportEntityFromSpreadsheet(file);
    return result;
  }

  let rawText = '';
  if ((detectedKind === 'image' || detectedKind === 'pdf') && CONFIG.GEMINI_API_KEY) {
    try {
      result.extracted = await GeminiOcr.extractForInbox(file);
    } catch (e) {
      console.warn('[inbox] Gemini file extraction failed', e);
    }
  } else if (detectedKind === 'document') {
    rawText = await extractTextForClassification(file);
    if (rawText && CONFIG.GEMINI_API_KEY) {
      try {
        result.extracted = await GeminiOcr.extractFromText(rawText);
      } catch (e) {
        console.warn('[inbox] Gemini text extraction failed', e);
      }
    }
  }

  if (!result.extracted && rawText) {
    const signals = extractSignalsFromText(rawText);
    result.extracted = { date: signals.date, cost: signals.cost, vendor: null, description: null, vin: signals.vin };
  }

  const guessText = [rawText, result.extracted ? JSON.stringify(result.extracted) : ''].filter(Boolean).join(' ');
  const vinFromExtraction = result.extracted && result.extracted.vin;
  const unitMatch = (vinFromExtraction && findUnitByVin(vinFromExtraction)) || guessUnitFromText(guessText);
  if (unitMatch) result.suggestedUnit = unitMatch;

  const effectiveUnitType = unitMatch ? unitMatch.unit_type : 'truck';
  const categoryHint = (result.extracted && result.extracted.category_hint) || '';
  const searchText = guessText + ' ' + categoryHint;
  const categoryGuess = guessCategoryFromText(searchText, effectiveUnitType);
  const componentGuess = guessComponentTypeFromText(searchText, effectiveUnitType);

  // Decide whether this looks more like a tracked-component job (new
  // engine, new brakes, a battery swap — the kind of thing the Components
  // tab was built for) or an ordinary maintenance line item. An exact name
  // match on either side wins outright; between two exact matches, or two
  // weaker "token" matches, the component reading is preferred, since
  // filing an engine/brake/battery invoice into the Components tab (with
  // its own cost/expected-life/warranty tracking) is more useful than a
  // generic maintenance entry — the reviewer can always switch the "File
  // as" selector back to Maintenance entry if this guess is wrong.
  if (componentGuess && componentGuess.strength === 'exact') {
    result.suggestedTarget = 'component';
    result.suggestedComponentType = componentGuess.type;
  } else if (categoryGuess && categoryGuess.strength === 'exact') {
    result.suggestedTarget = 'maintenance';
    result.suggestedCategory = categoryGuess.type;
  } else if (componentGuess) {
    result.suggestedTarget = 'component';
    result.suggestedComponentType = componentGuess.type;
  } else {
    result.suggestedTarget = 'maintenance';
    result.suggestedCategory = categoryGuess ? categoryGuess.type : null;
  }

  return result;
}

const InboxPipeline = {
  async uploadAndClassify(file) {
    const path = `inbox/${AppState.currentOrgId}/${Date.now()}_${slugFileName(file.name)}`;
    await DataLayer.withRetry(() => DataLayer.safeUpload('attachments', path, file));
    const classification = await classifyInboxFile(file);
    return DataLayer.withRetry(() =>
      // status/uploaded_at set explicitly rather than left to the column
      // defaults (schema.sql: status default 'pending', uploaded_at default
      // now()) — same convention the rest of the app follows (e.g.
      // Forms.incidentForm sets status: 'open' itself) so the row is
      // immediately correct client-side without waiting on a round trip.
      DataLayer.safeInsert('file_inbox', {
        storage_path: path,
        file_name: file.name,
        file_type: file.type || null,
        file_size: file.size || null,
        detected_kind: classification.detectedKind,
        suggested_unit_type: classification.suggestedUnit ? classification.suggestedUnit.unit_type : null,
        suggested_unit_id: classification.suggestedUnit ? classification.suggestedUnit.id : null,
        suggested_target: classification.suggestedTarget || 'maintenance',
        suggested_category_id: classification.suggestedCategory ? classification.suggestedCategory.id : null,
        suggested_component_type_id: classification.suggestedComponentType ? classification.suggestedComponentType.id : null,
        suggested_import_entity: classification.suggestedImportEntity || null,
        extracted: classification.extracted || null,
        status: 'pending',
        uploaded_at: new Date().toISOString(),
        uploaded_by: AppState.profile ? AppState.profile.id : null,
      })
    );
  },
};

// The org the signed-in user is currently working in, and their membership
// row in it. Every permission check reads from here — never from `profile`,
// which no longer carries a role now that roles are per-org.
function currentMembership() {
  return AppState.memberships.find((m) => m.org_id === AppState.currentOrgId) || null;
}
function currentOrg() {
  const m = currentMembership();
  return m ? m.organizations : null;
}

  const m = currentMembership();

function parseRoute() {
  const hash = location.hash.replace(/^#\/?/, '');
  const parts = hash.split('/').filter(Boolean);
  if (parts.length === 0) return { view: 'dashboard' };
  if (parts[0] === 'truck' || parts[0] === 'trailer') {
    return { view: 'unit', unitType: parts[0], unitId: parts[1], tab: parts[2] || 'overview' };
  }
  if (parts[0] === 'reports') return { view: 'reports' };
  if (parts[0] === 'settings') return { view: 'settings', tab: parts[1] || 'org' };
  if (parts[0] === 'drivers') return { view: 'drivers' };
  if (parts[0] === 'incidents') return { view: 'incidents' };
  if (parts[0] === 'parts') return { view: 'parts' };
  if (parts[0] === 'inbox') return { view: 'inbox' };
  return { view: 'dashboard' };
}

async function boot() {
  I18n.init(null);
  AppState.route = parseRoute();

  if (looksUnconfigured()) {
    document.getElementById('app').innerHTML = Views.configNeeded();
    return;
  }

  try {
    const client = DataLayer.init(CONFIG.SUPABASE_URL, CONFIG.SUPABASE_ANON_KEY);

    const { data: sessionData } = await client.auth.getSession();
    AppState.session = sessionData ? sessionData.session : null;

    client.auth.onAuthStateChange((_event, session) => {
      const wasSignedIn = !!AppState.session;
      AppState.session = session;
      if (session && !wasSignedIn) {
        initAfterAuth().catch((err) => {
          console.error('Post-auth init failed', err);
          document.getElementById('app').innerHTML = Views.bootError(err);
        });
      } else if (!session) {
        stopLiveTables();
        AppState.profile = null;
        AppState.memberships = [];
        AppState.currentOrgId = null;
        DataLayer.setOrgId(null);
        AppState.route = { view: 'dashboard' };
        render();
      }
    });

    if (AppState.session) {
      await initAfterAuth();
    } else {
      render();
    }
  } catch (err) {
    console.error('Boot failed', err);
    document.getElementById('app').innerHTML = Views.bootError(err);
  }
}

async function initAfterAuth() {
  const client = DataLayer.getClient();
  const uid = AppState.session.user.id;

  // Ensure a profile row exists (first login ever, before joining/creating
  // any organization). `noOrgStamp` because `profiles` has no org_id column.
  let { data: profile } = await client.from('profiles').select('*').eq('id', uid).maybeSingle();
  if (!profile) {
    const insertRes = await DataLayer.safeInsert(
      'profiles',
      { id: uid, display_name: AppState.session.user.email, language: I18n.current },
      { noOrgStamp: true }
    );
    profile = insertRes.data;
  }
  AppState.profile = profile;
  I18n.init(profile.language);

  await loadMemberships();
  render();
}

// Loads every organization the user belongs to, with their role in each, and
// selects one to work in (the last one used on this device, or the first).
async function loadMemberships() {
  const client = DataLayer.getClient();
  const { data, error } = await client
    .from('org_members')
    .select('org_id, role, can_view_cost, organizations(id, name, invite_code, logo_url)')
    .eq('user_id', AppState.session.user.id);
  if (error) throw error;
  AppState.memberships = data || [];

  if (AppState.memberships.length === 0) {
    // No org yet — the user sees the create/join screen (Views.onboarding).
    stopLiveTables();
    AppState.currentOrgId = null;
    DataLayer.setOrgId(null);
    return;
  }

  let stored = null;
  try { stored = localStorage.getItem(ORG_STORAGE_KEY); } catch (e) { /* private mode etc: non-fatal */ }
  const match = AppState.memberships.find((m) => m.org_id === stored);
  await switchOrg(match ? match.org_id : AppState.memberships[0].org_id);
}

  AppState.ui.reportsTab = 'fleet';
  AppState.ui.importState = { entityType: 'trucks', rows: null, error: null, result: null, sourceInboxId: null };
  AppState.ui.auditLogFilter = '';
  AppState.route = { view: 'dashboard' };
  location.hash = '';

  AppState.trucks = new DataLayer.LiveTable('trucks', { orderBy: 'name' });
  AppState.trailers = new DataLayer.LiveTable('trailers', { orderBy: 'name' });
  AppState.maintenanceTypes = new DataLayer.LiveTable('maintenance_types', { orderBy: 'sort_order' });
  AppState.vendors = new DataLayer.LiveTable('vendors', { orderBy: 'name' });
  AppState.maintenanceIntervals = new DataLayer.LiveTable('maintenance_intervals');
  AppState.drivers = new DataLayer.LiveTable('drivers', { orderBy: 'name' });
  AppState.parts = new DataLayer.LiveTable('parts', { orderBy: 'name' });
  AppState.incidentReports = new DataLayer.LiveTable('incident_reports', { orderBy: 'incident_date', ascending: false });
  AppState.fileInbox = new DataLayer.LiveTable('file_inbox', { orderBy: 'uploaded_at', ascending: false });
  AppState.orgMaintenanceSettings = new DataLayer.LiveTable('org_maintenance_settings');
  AppState.componentTypes = new DataLayer.LiveTable('component_types', { orderBy: 'sort_order' });

  const tables = [
    AppState.trucks, AppState.trailers, AppState.maintenanceTypes, AppState.vendors, AppState.maintenanceIntervals,
    AppState.drivers, AppState.parts, AppState.incidentReports, AppState.fileInbox, AppState.orgMaintenanceSettings,
    AppState.componentTypes,
  ];
  tables.forEach((tbl) => {
    tbl.onChange(deferredRender);
    tbl.startRealtime();
    tbl.startPolling(60000);
  });

  await Promise.all(tables.map((tbl) => tbl.load()));
  render();
}

function stopLiveTables() {
  [
    AppState.trucks, AppState.trailers, AppState.maintenanceTypes, AppState.vendors, AppState.maintenanceIntervals,
    AppState.drivers, AppState.parts, AppState.incidentReports, AppState.fileInbox, AppState.orgMaintenanceSettings,
    AppState.componentTypes,
  ].forEach((tbl) => tbl && tbl.stop());
}

// ----------------------------------------------------------------------------
// Background renders vs. an open native dialog
// ----------------------------------------------------------------------------
// Every live table (trucks, trailers, the file inbox, etc.) calls render()
// on its own, in the background, whenever a realtime event or the ~60s poll
// backstop sees a change — completely independent of anything the user is
// doing. render() replaces #app's entire innerHTML, which destroys and
// recreates every element inside it, including any <input type="file">
// mid-selection. Opening a native "Choose File" dialog (Add files, the
// Import file picker, any attachment field) takes the browser window out of
// focus for as long as the user is browsing their filesystem — plenty of
// time for a background render to land, silently orphan that exact input,
// and leave its eventual 'change' event with no live ancestor to bubble to.
// The user sees a file picked and then nothing happens, with no console
// error, because nothing actually threw — the event just had nowhere to go.
// Deferring background-triggered renders until the window has focus again
// closes that window without touching how any user-initiated render works.
let backgroundRenderPending = false;
function deferredRender() {
  if (typeof document !== 'undefined' && document.hasFocus && !document.hasFocus()) {
    backgroundRenderPending = true;
    return;
  }
  render();
}
if (typeof window !== 'undefined') {
  window.addEventListener('focus', () => {
    if (backgroundRenderPending) {
      backgroundRenderPending = false;
      render();
    }
  });
}

// ----------------------------------------------------------------------------
// Render
// ----------------------------------------------------------------------------
function render() {
  const root = document.getElementById('app');
  if (!AppState.session) {
    root.innerHTML = Views.login();
    attachDelegatedEvents(root);
    return;
  }
  if (!AppState.profile) {
    root.innerHTML = Views.loadingShell();
    return;
  }
  if (AppState.memberships.length === 0) {
    root.innerHTML = Views.onboarding();
    attachDelegatedEvents(root);
    return;
  }
  if (!AppState.trucks || !AppState.trucks.hasCompletedInitialLoad) {
    root.innerHTML = Views.loadingShell();
    return;
  }

  const route = AppState.route;
  let content = '';
  if (route.view === 'dashboard') content = Views.dashboard();
  else if (route.view === 'unit') content = Views.unitDetail(route.unitType, route.unitId, route.tab);
  else if (route.view === 'reports') content = Views.reports();
  else if (route.view === 'settings') content = Views.settings(route.tab);
  else if (route.view === 'drivers') content = Views.drivers();
  else if (route.view === 'incidents') content = Views.incidents();
  else if (route.view === 'parts') content = Views.parts();
  else if (route.view === 'inbox') content = Views.fileInbox();
  else content = Views.dashboard();

  root.innerHTML = Views.shell(content);
  attachDelegatedEvents(root);
  Views.afterRender && Views.afterRender(route);
}

document.addEventListener('DOMContentLoaded', boot);

</script>
</body>
</html>
