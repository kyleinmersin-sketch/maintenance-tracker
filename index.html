  // ---- Mileage tab (trucks only) --------------------------------------------
  mileageTab(truck) {
    const logs = useCache('mileage:' + truck.id, () => DataQueries.mileageLogs(truck.id));
    const rows = logs && !logs.__error ? logs : [];
    const active = [...rows.filter((r) => !r.voided_at)].sort((a, b) => new Date(a.reading_date) - new Date(b.reading_date));

    const rowsHtml = rows.length
      ? rows
          .map((r) => {
            const idx = active.findIndex((s) => s.id === r.id);
            const prev = idx > 0 ? active[idx - 1] : null;
            const delta = !r.voided_at && prev ? r.mileage - prev.mileage : null;
            return `
        <tr class="${r.voided_at ? 'row-voided' : ''}">
          <td>${fmtDate(r.reading_date)}</td>
          <td>${fmtMiles(r.mileage)}</td>
          <td>${delta !== null ? (delta >= 0 ? '+' : '') + delta.toLocaleString() : '—'}</td>
          <td>${esc(r.driver_name || '—')}</td>
          <td>${esc(r.note || '')}${r.voided_at ? `<br>${badge(t('voided_badge'), 'muted')} ${esc(r.void_reason || '')}` : ''}</td>
          <td>${!r.voided_at && canWrite() ? `<button type="button" class="btn-link" data-action="openVoidForm" data-table="mileage_logs" data-id="${r.id}" data-cache-key="mileage:${truck.id}">${esc(t('void_action'))}</button>` : ''}</td>
        </tr>`;
          })
          .join('')
      : `<tr><td colspan="6" class="empty-state">${esc(t('mileage_none'))}</td></tr>`;

    const period = AppState.ui.mileagePeriodByTruck[truck.id] || {};

    return `
      <div class="section-header">
        <h2>${esc(t('mileage_log_title'))}</h2>
        ${canWrite() ? `<button type="button" class="btn btn-primary" data-action="openMileageForm" data-truck-id="${truck.id}">${esc(t('mileage_add'))}</button>` : ''}
      </div>
      <div class="filter-form" data-role="mileage-period-calc" data-truck-id="${truck.id}">
        <label>${esc(t('mileage_period_from'))}<input type="date" data-role="period-from" value="${esc(period.from || '')}"></label>
        <label>${esc(t('mileage_period_to'))}<input type="date" data-role="period-to" value="${esc(period.to || '')}"></label>
        <div class="filter-actions">
          <button type="button" class="btn btn-secondary" data-action="calcMileagePeriod" data-truck-id="${truck.id}">${esc(t('mileage_period_calc'))}</button>
        </div>
        ${period.result !== undefined ? `<p class="hint-text">${period.result === null ? esc(t('mileage_period_no_data')) : `<strong>${esc(t('mileage_period_result'))}: ${fmtMiles(period.result)}</strong>`}</p>` : ''}
      </div>
      <table class="data-table">
        <thead><tr>
          <th>${esc(t('mileage_date'))}</th><th>${esc(t('mileage_value'))}</th><th>${esc(t('mileage_delta'))}</th>
          <th>${esc(t('mileage_driver'))}</th><th>${esc(t('mileage_note'))}</th><th></th>
        </tr></thead>
        <tbody>${!logs ? `<tr><td colspan="6">${esc(t('loading'))}</td></tr>` : rowsHtml}</tbody>
      </table>
    `;
  },

  // ---- Fuel purchase log (trucks only, feeds the IFTA summary on Reports) --
  fuelTab(truck) {
    const rows = useCache('fuel:' + truck.id, () => DataQueries.fuelPurchases(truck.id));
    const list = rows && !rows.__error ? rows : [];

    const rowsHtml = list.length
      ? list
          .map(
            (r) => `
        <tr class="${r.voided_at ? 'row-voided' : ''}">
          <td>${fmtDate(r.purchase_date)}</td>
          <td>${esc(r.state_code)}</td>
          <td>${Number(r.gallons).toLocaleString()}</td>
          <td>${r.total_cost !== null && r.total_cost !== undefined && canSeeCost() ? fmtMoney(r.total_cost) : '—'}</td>
          <td>${r.odometer ? fmtMiles(r.odometer) : '—'}</td>
          <td>${esc(r.note || '')}${r.voided_at ? `<br>${badge(t('voided_badge'), 'muted')} ${esc(r.void_reason || '')}` : ''}</td>
          <td>${!r.voided_at && canWrite() ? `<button type="button" class="btn-link" data-action="openVoidForm" data-table="fuel_purchases" data-id="${r.id}" data-cache-key="fuel:${truck.id}">${esc(t('void_action'))}</button>` : ''}</td>
        </tr>`
          )
          .join('')
      : `<tr><td colspan="7" class="empty-state">${esc(t('fuel_none_yet'))}</td></tr>`;

    return `
      <div class="section-header">
        <h2>${esc(t('tab_fuel'))}</h2>
        ${canWrite() ? `<button type="button" class="btn btn-primary" data-action="openFuelForm" data-truck-id="${truck.id}">${esc(t('fuel_add'))}</button>` : ''}
      </div>
      <table class="data-table">
        <thead><tr>
          <th>${esc(t('fuel_date'))}</th><th>${esc(t('fuel_state'))}</th><th>${esc(t('fuel_gallons'))}</th>
          <th>${esc(t('fuel_total_cost'))}</th><th>${esc(t('fuel_odometer'))}</th><th>${esc(t('fuel_note'))}</th><th></th>
        </tr></thead>
        <tbody>${!rows ? `<tr><td colspan="7">${esc(t('loading'))}</td></tr>` : rowsHtml}</tbody>
      </table>
    `;
  },

  // ---- Maintenance tab --------------------------------------------------
  maintenanceTab(unitType, unit) {
    const entries = useCache('maintenance:' + unitType + ':' + unit.id, () => DataQueries.maintenanceEntries(unitType, unit.id));
    const rows = entries && !entries.__error ? entries : [];
    const active = rows.filter((m) => !m.voided_at);
    const total = active.reduce((sum, m) => sum + (m.cost !== null && m.cost !== undefined ? Number(m.cost) : 0), 0);

    const warrantyInfo = (m) => {
      if (!m.warranty_months) return '';
      const until = new Date(m.date_performed);
      until.setMonth(until.getMonth() + m.warranty_months);
      const isActive = until >= new Date();
      return `<br>${badge(t(isActive ? 'warranty_active' : 'warranty_expired', { date: fmtDate(until.toISOString().slice(0, 10)) }), isActive ? 'success' : 'muted')}`;
    };

    const rowsHtml = rows.length
      ? rows
          .map((m) => {
            const typeName = m.custom_type_text
              ? m.custom_type_text
              : m.maintenance_types
              ? I18n.field(m.maintenance_types, 'name')
              : '—';
            const vendor = m.vendor_id ? vendorById(m.vendor_id) : null;
            return `
        <tr class="${m.voided_at ? 'row-voided' : ''}">
          <td>${fmtDate(m.date_performed)}</td>
          <td>${esc(typeName)}</td>
          <td>${unitType === 'truck' ? fmtMiles(m.mileage_at_service) : '—'}</td>
          <td>${esc(vendor ? vendor.name : '—')}</td>
          <td>${esc(m.detail_text || m.note || '')}${m.voided_at ? `<br>${badge(t('voided_badge'), 'muted')} ${esc(m.void_reason || '')}` : warrantyInfo(m)}</td>
          <td>${canSeeCost() ? fmtMoney(m.cost) : '—'}</td>
          <td>
            <button type="button" class="btn-link" data-action="viewAttachments" data-table="maintenance_entries" data-id="${m.id}">📎</button>
            ${!m.voided_at && canWrite() ? `<button type="button" class="btn-link" data-action="openVoidForm" data-table="maintenance_entries" data-id="${m.id}" data-cache-key="maintenance:${unitType}:${unit.id}">${esc(t('void_action'))}</button>` : ''}
          </td>
        </tr>`;
          })
          .join('')
      : `<tr><td colspan="7" class="empty-state">${esc(t('maintenance_none'))}</td></tr>`;

    return `
      <div class="section-header">
        <h2>${esc(t('maintenance_title'))}</h2>
        ${canWrite() ? `<button type="button" class="btn btn-primary" data-action="openMaintenanceForm" data-unit-type="${unitType}" data-unit-id="${unit.id}">${esc(t('maintenance_add'))}</button>` : ''}
      </div>
      <table class="data-table">
        <thead><tr>
          <th>${esc(t('maintenance_date'))}</th><th>${esc(t('maintenance_type'))}</th>
          ${unitType === 'truck' ? `<th>${esc(t('maintenance_mileage'))}</th>` : '<th></th>'}
          <th>${esc(t('vendor_field'))}</th>
          <th>${esc(t('maintenance_note'))}</th><th>${esc(t('maintenance_cost'))}</th><th></th>
        </tr></thead>
        <tbody>${!entries ? `<tr><td colspan="7">${esc(t('loading'))}</td></tr>` : rowsHtml}</tbody>
        ${rows.length && canSeeCost() ? `<tfoot><tr><td colspan="5"></td><td><strong>${fmtMoney(total)}</strong></td><td></td></tr></tfoot>` : ''}
      </table>
    `;
  },

  // ---- Components tab --------------------------------------------------
  // One card per tracked component type (Settings > Component types decides
  // the list). Each card shows the currently-installed part(s) — usually
  // one, but batteries/brake chambers etc. can legitimately have more than
  // one active at a time — plus the full install/replacement history.
  componentsTab(unitType, unit) {
    const rows_ = useCache('components:' + unitType + ':' + unit.id, () => DataQueries.unitComponents(unitType, unit.id));
    const rows = rows_ && !rows_.__error ? rows_ : [];
    const historical = useCache('componentHistoricalStats', DataQueries.componentHistoricalStats) || {};
    const mileageSummary = unitType === 'truck' ? useCache('truckMileage', DataQueries.truckMileageSummary) : null;
    const currentMileage = unitType === 'truck' && mileageSummary && mileageSummary[unit.id] ? mileageSummary[unit.id].current_mileage : null;
    const types = componentTypesFor(unitType);
    const th = dueSoonThresholds();

    if (!rows_ && !types.length) return `<p>${esc(t('loading'))}</p>`;
    if (!types.length) return `<p class="empty-state">${esc(t('component_none_types'))}</p>`;

    const cardsHtml = types
      .map((ctype) => {
        const typeRows = rows.filter((r) => r.component_type_id === ctype.id);
        const activeRows = typeRows.filter((r) => r.status === 'active' && !r.voided_at);
        const hstat = historical[ctype.id] || {};

        const instanceHtml = activeRows.length
          ? activeRows.map((r) => this.componentInstanceCard(unitType, unit, ctype, r, currentMileage, hstat, th)).join('')
          : `<p class="empty-state">${esc(t('component_none'))}</p>`;

        return `
        <section class="settings-section">
          <div class="section-header">
            <h3>${esc(I18n.field(ctype, 'name'))}${ctype.is_custom ? ` ${badge('custom', 'muted')}` : ''}</h3>
            ${canWrite() ? `<button type="button" class="btn btn-secondary" data-action="openComponentForm" data-mode="install" data-unit-type="${unitType}" data-unit-id="${unit.id}" data-component-type-id="${ctype.id}">${esc(t('component_install'))}</button>` : ''}
          </div>
          ${instanceHtml}
          ${typeRows.length ? `
          <details>
            <summary class="hint-text">${esc(t('component_history'))} (${typeRows.length})</summary>
            ${this.componentHistoryTable(unitType, unit, ctype, typeRows)}
          </details>` : ''}
        </section>`;
      })
      .join('');

    return `
      <div class="section-header"><h2>${esc(t('tab_components'))}</h2></div>
      ${!rows_ ? `<p>${esc(t('loading'))}</p>` : cardsHtml}
    `;
  },

  // One currently-installed part. `hstat` is this component type's org-wide
  // replacement history (see DataQueries.componentHistoricalStats) — used as
  // a data-driven fallback for "expected life" when nobody has typed one in
  // by hand, and as the basis for the estimated-replacement-cost figure.
  componentInstanceCard(unitType, unit, ctype, row, currentMileage, hstat, th) {
    const lifeUsedMiles =
      row.install_mileage !== null && row.install_mileage !== undefined && currentMileage !== null && currentMileage !== undefined
        ? currentMileage - row.install_mileage
        : null;
    const manualExpected = row.expected_life_miles;
    const histExpected = hstat.avgLifeMiles ? Math.round(hstat.avgLifeMiles) : null;
    const effectiveExpected = manualExpected || histExpected;
    const remaining = lifeUsedMiles !== null && effectiveExpected !== null ? effectiveExpected - lifeUsedMiles : null;

    // "Inspect soon" once within 15% of expected life or the org's due-soon
    // mileage setting, whichever window is larger — a flat 500 mi default
    // (tuned for oil-change-style intervals) would almost never trigger for
    // a 65,000-mile brake system, so long-interval components get a
    // proportionally meaningful heads-up instead.
    const status = remaining === null ? null : classifyRemaining(remaining, Math.max(th.miles, Math.round((effectiveExpected || 0) * 0.15)));
    const statusBadge =
      status === 'overdue' ? badge(t('component_status_overdue'), 'danger')
      : status === 'due_soon' || status === 'due_now' ? badge(t('component_status_inspect_soon'), 'warning')
      : status === 'ok' ? badge(t('component_status_ok'), 'success')
      : '';

    const vendor = row.vendor_id ? vendorById(row.vendor_id) : null;
    const supplier = vendor ? vendor.name : row.supplier_text || null;

    return `
      <div class="unit-card-row" style="flex-direction:column;align-items:stretch;gap:6px;border-top:none;padding-top:0">
        <div class="unit-card-row"><span class="label">${esc(row.custom_label || '')}</span><span class="value">${statusBadge}</span></div>
        <div class="overview-grid">
          <div class="stat-card">
            <div class="stat-label">${esc(t('component_install_date'))}</div>
            <div class="stat-value" style="font-size:1rem">${fmtDate(row.install_date)}</div>
            <div class="stat-sub">${row.install_mileage !== null && row.install_mileage !== undefined ? fmtMiles(row.install_mileage) : '—'}${row.install_hours !== null && row.install_hours !== undefined ? ` · ${row.install_hours} ${esc(t('hours_unit'))}` : ''}</div>
          </div>
          ${unitType === 'truck' ? `
          <div class="stat-card">
            <div class="stat-label">${esc(t('current_mileage'))}</div>
            <div class="stat-value" style="font-size:1rem">${currentMileage !== null && currentMileage !== undefined ? fmtMiles(currentMileage) : '—'}</div>
            <div class="stat-sub">${lifeUsedMiles !== null ? esc(t('component_life_used_miles', { n: lifeUsedMiles.toLocaleString() })) : ''}</div>
          </div>` : ''}
          <div class="stat-card">
            <div class="stat-label">${esc(t('component_historical_avg_life'))}</div>
            <div class="stat-value" style="font-size:1rem">${histExpected !== null ? fmtMiles(histExpected) : '—'}</div>
            <div class="stat-sub">${histExpected !== null ? esc(t('component_historical_avg_life_value', { n: histExpected.toLocaleString(), count: hstat.lifeMilesCount })) : esc(t('component_no_history_yet'))}</div>
          </div>
          <div class="stat-card">
            <div class="stat-label">${esc(t('component_life_remaining'))}</div>
            <div class="stat-value" style="font-size:1rem">${remaining !== null ? (remaining >= 0 ? esc(t('component_life_remaining_miles', { n: remaining.toLocaleString() })) : esc(t('component_life_overdue'))) : '—'}</div>
            <div class="stat-sub">${remaining === null ? esc(t('component_life_remaining_unknown')) : (manualExpected ? '' : esc(t('component_historical_avg_life')))}</div>
          </div>
          ${canSeeCost() ? `
          <div class="stat-card">
            <div class="stat-label">${esc(t('component_estimated_replacement_cost'))}</div>
            <div class="stat-value" style="font-size:1rem">${hstat.avgCost ? fmtMoney(hstat.avgCost) : '—'}</div>
            <div class="stat-sub">${hstat.avgCost ? esc(t('component_estimated_replacement_hint')) : esc(t('component_no_history_yet'))}</div>
          </div>` : ''}
        </div>
        ${status === 'due_soon' || status === 'due_now' ? `<p class="hint-text">${esc(t('component_inspection_window'))}: ${esc(t('component_inspection_window_value', { n: Math.max(remaining, 0).toLocaleString() }))}</p>` : ''}
        <div class="unit-card-row">
          <span class="label">${esc(t('component_supplier'))} / ${esc(t('component_invoice_number'))}</span>
          <span class="value">${esc(supplier || '—')}${row.invoice_number ? ` · ${esc(row.invoice_number)}` : ''}${canSeeCost() && row.cost ? ` · ${fmtMoney(row.cost)}` : ''}</span>
        </div>
        ${row.warranty_months || row.warranty_miles ? `<div class="unit-card-row"><span class="label">${esc(t('warranty_months_field'))}</span><span class="value">${row.warranty_months ? row.warranty_months + ' mo' : ''}${row.warranty_months && row.warranty_miles ? ' / ' : ''}${row.warranty_miles ? fmtMiles(row.warranty_miles) : ''}</span></div>` : ''}
        ${row.note ? `<div class="unit-card-row"><span class="label">${esc(t('component_note'))}</span><span class="value">${esc(row.note)}</span></div>` : ''}
        ${canWrite() ? `
        <div class="modal-actions" style="padding-top:6px">
          <button type="button" class="btn-link" data-action="viewAttachments" data-table="unit_components" data-id="${row.id}">📎</button>
          <span>
            <button type="button" class="btn btn-primary" data-action="openComponentForm" data-mode="replace" data-unit-type="${unitType}" data-unit-id="${unit.id}" data-component-type-id="${ctype.id}" data-replace-id="${row.id}">${esc(t('component_replace'))}</button>
            <button type="button" class="btn-link" data-action="openVoidForm" data-table="unit_components" data-id="${row.id}" data-cache-key="components:${unitType}:${unit.id}">${esc(t('component_void'))}</button>
          </span>
        </div>` : ''}
      </div>
    `;
  },

  componentHistoryTable(unitType, unit, ctype, rows) {
    const sorted = [...rows].sort((a, b) => new Date(b.install_date) - new Date(a.install_date));
    return `
      <table class="data-table">
        <thead><tr>
          <th>${esc(t('component_status_active'))}/${esc(t('component_status_removed'))}</th>
          <th>${esc(t('component_install_date'))}</th><th>${esc(t('component_removal_date'))}</th>
          <th>${esc(t('component_supplier'))}</th><th>${esc(t('component_cost'))}</th><th></th>
        </tr></thead>
        <tbody>
          ${sorted
            .map((r) => {
              const vendor = r.vendor_id ? vendorById(r.vendor_id) : null;
              const voided = r.voided_at
                ? `<br>${badge(t('voided_badge'), 'muted')} ${esc(r.void_reason || '')}`
                : '';
              return `
          <tr class="${r.voided_at ? 'row-voided' : ''}">
            <td>${badge(t(r.status === 'active' ? 'component_status_active' : 'component_status_removed'), r.status === 'active' ? 'success' : 'muted')}${voided}</td>
            <td>${fmtDate(r.install_date)}${r.install_mileage !== null && r.install_mileage !== undefined ? `<br>${fmtMiles(r.install_mileage)}` : ''}</td>
            <td>${r.removal_date ? fmtDate(r.removal_date) : '—'}${r.removal_mileage !== null && r.removal_mileage !== undefined ? `<br>${fmtMiles(r.removal_mileage)}` : ''}${r.removal_reason ? `<br><span class="hint-text">${esc(r.removal_reason)}</span>` : ''}</td>
            <td>${esc(vendor ? vendor.name : r.supplier_text || '—')}</td>
            <td>${canSeeCost() ? fmtMoney(r.cost) : '—'}</td>
            <td>
              <button type="button" class="btn-link" data-action="viewAttachments" data-table="unit_components" data-id="${r.id}">📎</button>
              ${!r.voided_at && canWrite() ? `<button type="button" class="btn-link" data-action="openVoidForm" data-table="unit_components" data-id="${r.id}" data-cache-key="components:${unitType}:${unit.id}">${esc(t('void_action'))}</button>` : ''}
            </td>
          </tr>`;
            })
            .join('')}
        </tbody>
      </table>
    `;
  },

  // ---- Tires tab -----------------------------------------------------------
  tiresTab(unitType, unit, compact) {
    const events = useCache('tires:' + unitType + ':' + unit.id, () => DataQueries.tireEvents(unitType, unit.id));
    const rows = events && !events.__error ? events : [];

    const byPosition = {};
    rows.forEach((e) => {
      if (!byPosition[e.position_code]) byPosition[e.position_code] = [];
      byPosition[e.position_code].push(e);
    });
    const statusByPosition = {};
    Object.keys(byPosition).forEach((code) => {
      statusByPosition[code] = { hasTire: byPosition[code].some((e) => !e.voided_at) };
    });

    const selected = AppState.ui.selectedTirePos[unit.id];
    const diagram = TireDiagrams.render(unitType, statusByPosition, selected);

    let detail = '';
    if (selected) {
      const posEvents = byPosition[selected] || [];
      const current = posEvents.find((e) => !e.voided_at);
      const mileageSummary = unitType === 'truck' ? useCache('truckMileage', DataQueries.truckMileageSummary) : null;
      const currentUnitMileage = mileageSummary && mileageSummary[unit.id] ? mileageSummary[unit.id].current_mileage : null;
      const milesOnTire =
        current && current.mileage_at_install !== null && current.mileage_at_install !== undefined && currentUnitMileage !== null && currentUnitMileage !== undefined
          ? currentUnitMileage - current.mileage_at_install
          : null;

      let inspectionsPanel = '';
      if (current) {
        const inspections = useCache('tireInspections:' + current.id, () => DataQueries.tireInspections(current.id));
        const inspRows = inspections && !inspections.__error ? inspections : [];
        inspectionsPanel = `
          <div class="section-header">
            <h4>${esc(t('tire_inspections_title'))}</h4>
            ${canWrite() ? `<button type="button" class="btn btn-secondary" data-action="openTireInspectionForm" data-tire-event-id="${current.id}" data-cache-key="tireInspections:${current.id}">${esc(t('tire_inspection_add'))}</button>` : ''}
          </div>
          <p class="hint-text">${esc(t('tire_decision_hint'))}</p>
          ${inspRows.length ? `
          <table class="data-table">
            <thead><tr><th>${esc(t('tire_inspection_date'))}</th><th>${esc(t('tire_tread_depth'))}</th><th>${esc(t('tire_inspection_mileage'))}</th><th>${esc(t('tire_note'))}</th></tr></thead>
            <tbody>${inspRows.map((i) => `
              <tr>
                <td>${fmtDate(i.inspection_date)}</td>
                <td>${i.tread_depth_32nds !== null && i.tread_depth_32nds !== undefined ? i.tread_depth_32nds + '/32"' : '—'}</td>
                <td>${i.mileage_at_inspection ? fmtMiles(i.mileage_at_inspection) : '—'}</td>
                <td>${esc(i.note || '—')}</td>
              </tr>`).join('')}</tbody>
          </table>` : `<p class="empty-state">${esc(t('tire_inspection_none'))}</p>`}
        `;
      }

      detail = `
        <div class="tire-detail-panel">
          <div class="section-header">
            <h3>${esc(t('tire_position'))}: ${esc(selected)}</h3>
            <div>
              ${canWrite() && current ? `<button type="button" class="btn btn-secondary" data-action="openRepositionForm" data-unit-type="${unitType}" data-unit-id="${unit.id}" data-tire-event-id="${current.id}" data-from-position="${selected}">${esc(t('tire_reposition'))}</button>` : ''}
              ${canWrite() ? `<button type="button" class="btn btn-primary" data-action="openTireForm" data-unit-type="${unitType}" data-unit-id="${unit.id}" data-position="${selected}">${esc(t('tire_add'))}</button>` : ''}
            </div>
          </div>
          <div class="tire-current">
            <strong>${esc(t('tire_current'))}:</strong>
            ${current ? `${esc(current.brand || '')} ${esc(current.model || '')} — ${fmtDate(current.install_date)}${current.tire_serial_number ? ` — S/N ${esc(current.tire_serial_number)}` : ''}${milesOnTire !== null ? ` — ${esc(t('tire_miles_on_tire'))}: ${fmtMiles(milesOnTire)}` : ''}` : esc(t('tire_none_installed'))}
          </div>
          ${inspectionsPanel}
          <h4>${esc(t('tire_history'))}</h4>
          <table class="data-table">
            <thead><tr>
              <th>${esc(t('tire_install_date'))}</th>
              ${unitType === 'truck' ? `<th>${esc(t('tire_mileage'))}</th>` : ''}
              <th>${esc(t('tire_brand'))}</th><th>${esc(t('tire_model'))}</th>
              <th>${esc(t('tire_serial_number'))}</th>
              <th>${esc(t('vendor_field'))}</th>
              <th>${esc(t('tire_reason'))}</th><th>${esc(t('tire_cost'))}</th><th></th>
            </tr></thead>
            <tbody>
              ${posEvents.length
                ? posEvents
                    .map((e) => {
                      const vendor = e.vendor_id ? vendorById(e.vendor_id) : null;
                      const removalInfo = e.voided_at
                        ? `<br>${badge(t('voided_badge'), 'muted')} ${esc(e.void_reason || '')}${e.removal_date ? ` — ${esc(t('tire_removal_date'))}: ${fmtDate(e.removal_date)}` : ''}${e.removal_mileage ? ` (${fmtMiles(e.removal_mileage)})` : ''}`
                        : '';
                      return `
                <tr class="${e.voided_at ? 'row-voided' : ''}">
                  <td>${fmtDate(e.install_date)}</td>
                  ${unitType === 'truck' ? `<td>${fmtMiles(e.mileage_at_install)}</td>` : ''}
                  <td>${esc(e.brand || '—')}</td><td>${esc(e.model || '—')}</td>
                  <td>${esc(e.tire_serial_number || '—')}</td>
                  <td>${esc(vendor ? vendor.name : '—')}</td>
                  <td>${esc(e.reason || '—')}${removalInfo}</td>
                  <td>${canSeeCost() ? fmtMoney(e.cost) : '—'}</td>
                  <td>${!e.voided_at && canWrite() ? `<button type="button" class="btn-link" data-action="openVoidForm" data-table="tire_events" data-id="${e.id}" data-cache-key="tires:${unitType}:${unit.id}">${esc(t('void_action'))}</button>` : ''}</td>
                </tr>`;
                    })
                    .join('')
                : `<tr><td colspan="9" class="empty-state">${esc(t('tire_none'))}</td></tr>`}
            </tbody>
          </table>
        </div>`;
    }

    return `
      ${compact ? `<h2>${esc(t('tires_title'))}</h2>` : `
        <div class="section-header"><h2>${esc(t('tires_title'))}</h2></div>
        <p class="hint-text">${esc(t('tires_click_hint'))}</p>`}
      <div class="tire-diagram-wrap" data-role="tire-diagram" data-unit-type="${unitType}" data-unit-id="${unit.id}">
        ${diagram}

  // ---- Reports → Management report tab (TZ §8) -----------------------------
  managementReport() {
    const state = AppState.ui.managementReport;
    const allUnits = allUnitsList();
    const unitOptions = allUnits
      .map((u) => `<option value="${u.unit_type}:${u.id}" ${state.unitKey === u.unit_type + ':' + u.id ? 'selected' : ''}>${esc(u.name)}</option>`)
      .join('');
    const periodBtn = (key) =>
      `<button type="button" class="tab-item ${state.period === key ? 'active' : ''}" data-action="changeManagementReportPeriod" data-period="${key}">${esc(t('period_' + key))}</button>`;

    const header = `
      <div class="page-header"><h1>${esc(t('management_report_title'))}</h1></div>
      <div class="filter-form">
        <label>${esc(t('management_report_asset'))}
          <select data-action="changeManagementReportAsset">
            <option value="">${esc(t('management_report_select_asset'))}</option>
            ${unitOptions}
          </select>
        </label>
        <div>
          <nav class="tab-nav">${['week', 'month', 'quarter', 'year', 'all_time', 'custom'].map(periodBtn).join('')}</nav>
          ${state.period === 'custom' ? `
            <label>${esc(t('period_from'))}<input type="date" name="dateFrom" data-action="changeManagementReportDate" value="${esc(state.dateFrom || '')}"></label>
            <label>${esc(t('period_to'))}<input type="date" name="dateTo" data-action="changeManagementReportDate" value="${esc(state.dateTo || '')}"></label>
          ` : ''}
        </div>
      </div>
    `;

    if (!state.unitKey) return header;
    const [unitType, unitId] = state.unitKey.split(':');
    const unit = getUnitById(unitType, unitId);
    if (!unit) return header;

    const range = periodDateRange(state.period, state.dateFrom, state.dateTo);
    const cacheKey = `mgmtReport:${state.unitKey}:${state.period}:${range.from || ''}:${range.to || ''}`;
    const entries = useCache(cacheKey, () => DataQueries.managementReportEntries(unitType, unitId, range.from, range.to));
    const lastByType = useCache('lastEntryByTypeForUnit:' + state.unitKey, () => DataQueries.lastEntryByTypeForUnit(unitType, unitId));
    const mileageSummary = unitType === 'truck' ? useCache('truckMileage', DataQueries.truckMileageSummary) : null;

    if (!entries || !lastByType || (unitType === 'truck' && !mileageSummary)) {
      return header + `<p class="hint-text">${esc(t('loading'))}</p>`;
    }
    const rows = entries.__error ? [] : entries;

    const mileageRow = mileageSummary ? mileageSummary[unitId] : null;
    const currentMileage = mileageRow ? mileageRow.current_mileage : null;
    const milesWithCompany =
      unitType === 'truck' && currentMileage !== null && currentMileage !== undefined && unit.beginning_mileage !== null && unit.beginning_mileage !== undefined
        ? currentMileage - unit.beginning_mileage
        : null;

    const eventsCount = rows.length;
    const partsCost = rows.reduce((s, r) => s + (r.parts_cost ? Number(r.parts_cost) : 0), 0);
    const laborCost = rows.reduce((s, r) => s + (r.labor_cost ? Number(r.labor_cost) : 0), 0);
    const otherCost = rows.reduce((s, r) => s + (r.other_cost ? Number(r.other_cost) : 0), 0);
    const totalCost = rows.reduce((s, r) => s + (r.cost ? Number(r.cost) : 0), 0);

    // Maintenance-due table: every type with an effective interval AND a
    // baseline entry for this unit, same computation the dashboard alert
    // panel uses (computeDueStatus), just scoped to this one unit.
    const thresholds = dueSoonThresholds();
    const today = new Date();
    const dueRows = maintenanceTypesFor(unitType)
      .map((mt) => {
        const interval = effectiveInterval(unitType, unitId, mt.id);
        const lastEntry = lastByType[mt.id];
        const due = computeDueStatus(lastEntry, interval, currentMileage, today, thresholds);
        if (!due) return null;
        return { mt, interval, lastEntry, due };
      })
      .filter(Boolean);

    return `
      ${header}
      <div class="settings-section">
        <h2>${esc(unit.name)}</h2>
        <p class="hint-text">${esc(t('unit_vin'))}: ${esc(unit.vin || '—')} — ${esc(t('mgmt_report_through'))} ${fmtDate(today.toISOString().slice(0, 10))}</p>
      </div>
      ${unitType === 'truck' ? `
      <section class="settings-section">
        <h3>${esc(t('mgmt_report_mileage_section'))}</h3>
        <div class="overview-grid">
          <div class="stat-card"><span class="stat-label">${esc(t('mgmt_report_current_mileage'))}</span><span class="stat-value">${currentMileage !== null && currentMileage !== undefined ? fmtMiles(currentMileage) : '—'}</span></div>
          <div class="stat-card"><span class="stat-label">${esc(t('mgmt_report_beginning_mileage'))}</span><span class="stat-value">${unit.beginning_mileage !== null && unit.beginning_mileage !== undefined ? fmtMiles(unit.beginning_mileage) : '—'}</span></div>
          <div class="stat-card"><span class="stat-label">${esc(t('mgmt_report_miles_driven'))}</span><span class="stat-value">${milesWithCompany !== null ? fmtMiles(milesWithCompany) : '—'}</span></div>
        </div>
      </section>` : ''}
      <section class="settings-section">
        <h3>${esc(t('mgmt_report_maintenance_section'))}</h3>
        <div class="overview-grid">
          <div class="stat-card"><span class="stat-label">${esc(t('mgmt_report_events'))}</span><span class="stat-value">${eventsCount}</span></div>
          ${canSeeCost() ? `
          <div class="stat-card"><span class="stat-label">${esc(t('mgmt_report_parts_cost'))}</span><span class="stat-value">${fmtMoney(partsCost)}</span></div>
          <div class="stat-card"><span class="stat-label">${esc(t('mgmt_report_labor_cost'))}</span><span class="stat-value">${fmtMoney(laborCost)}</span></div>
          <div class="stat-card"><span class="stat-label">${esc(t('mgmt_report_other_cost'))}</span><span class="stat-value">${fmtMoney(otherCost)}</span></div>
          <div class="stat-card"><span class="stat-label">${esc(t('mgmt_report_total_cost'))}</span><span class="stat-value">${fmtMoney(totalCost)}</span></div>
          ` : ''}
        </div>
      </section>
      <section class="settings-section">
        <div class="section-header">
          <h3>${esc(t('mgmt_report_detail_title'))}</h3>
          <div>
            <button type="button" class="btn btn-secondary" data-action="exportManagementReportExcel" data-unit-type="${unitType}" data-unit-id="${unitId}">${esc(t('report_export_excel'))}</button>
            <button type="button" class="btn btn-secondary" data-action="exportManagementReportPdf" data-unit-type="${unitType}" data-unit-id="${unitId}">${esc(t('report_export_pdf'))}</button>
          </div>
        </div>
        <table class="data-table">
          <thead><tr>
            <th>${esc(t('maintenance_date'))}</th><th>${esc(t('maintenance_mileage'))}</th><th>${esc(t('maintenance_type'))}</th>
            <th>${esc(t('vendor_field'))}</th><th>${esc(t('maintenance_invoice_number'))}</th><th>${esc(t('maintenance_cost'))}</th>
          </tr></thead>
          <tbody>
            ${rows.length ? rows.map((r) => `
              <tr>
                <td>${fmtDate(r.date_performed)}</td>
                <td>${r.mileage_at_service ? fmtMiles(r.mileage_at_service) : '—'}</td>
                <td>${esc(r.custom_type_text || (r.maintenance_types ? I18n.field(r.maintenance_types, 'name') : ''))}</td>
                <td>${esc(vendorById(r.vendor_id) ? vendorById(r.vendor_id).name : '—')}</td>
                <td>${esc(r.invoice_number || '—')}</td>
                <td>${canSeeCost() ? fmtMoney(r.cost) : '—'}</td>
              </tr>`).join('') : `<tr><td colspan="6" class="empty-state">${esc(t('maintenance_none'))}</td></tr>`}
          </tbody>
        </table>
      </section>
      <section class="settings-section due-panel">
        <h3>${esc(t('mgmt_report_due_title'))}</h3>
        ${dueRows.length ? `
        <table class="data-table">
          <thead><tr>
            <th>${esc(t('mgmt_report_due_service'))}</th><th>${esc(t('mgmt_report_due_last_done'))}</th>
            <th>${esc(t('mgmt_report_due_mileage'))}</th><th>${esc(t('mgmt_report_due_next'))}</th>
            <th>${esc(t('mgmt_report_due_remaining'))}</th><th></th>
          </tr></thead>
          <tbody>
            ${dueRows.map(({ mt, interval, lastEntry, due }) => `
              <tr>
                <td>${esc(I18n.field(mt, 'name'))}</td>
                <td>${fmtDate(lastEntry.date_performed)}</td>
                <td>${lastEntry.mileage_at_service ? fmtMiles(lastEntry.mileage_at_service) : '—'}</td>
                <td>${interval.interval_miles && lastEntry.mileage_at_service !== null ? fmtMiles(lastEntry.mileage_at_service + interval.interval_miles) : '—'}</td>
                <td>${due.milesRemaining !== null ? fmtMiles(due.milesRemaining) + ' mi' : due.daysRemaining !== null ? due.daysRemaining + 'd' : '—'}</td>
                <td>${badge(t('due_status_' + due.status), due.status === 'ok' ? 'success' : due.status === 'due_soon' ? 'warning' : 'danger')}</td>
              </tr>`).join('')}
          </tbody>
        </table>` : `<p class="empty-state">${esc(t('mgmt_report_due_none'))}</p>`}
      </section>
    `;
  },

  // ---- Reports → Cost analysis tab (TZ §9) ----------------------------------
  costAnalysis() {
    const state = AppState.ui.costAnalysis;
    const periodBtn = (key) =>
      `<button type="button" class="tab-item ${state.period === key ? 'active' : ''}" data-action="changeCostAnalysisPeriod" data-period="${key}">${esc(t('period_' + key))}</button>`;

    const header = `
      <div class="page-header"><h1>${esc(t('cost_analysis_title'))}</h1></div>
      <div class="filter-form">
        <div>
          <nav class="tab-nav">${['week', 'month', 'quarter', 'year', 'all_time', 'custom'].map(periodBtn).join('')}</nav>
          ${state.period === 'custom' ? `
            <label>${esc(t('period_from'))}<input type="date" name="dateFrom" data-action="changeCostAnalysisDate" value="${esc(state.dateFrom || '')}"></label>
            <label>${esc(t('period_to'))}<input type="date" name="dateTo" data-action="changeCostAnalysisDate" value="${esc(state.dateTo || '')}"></label>
          ` : ''}
        </div>
      </div>
    `;

    if (!canSeeCost()) return header;

    const range = periodDateRange(state.period, state.dateFrom, state.dateTo);
    const cacheKey = `costAnalysis:${state.period}:${range.from || ''}:${range.to || ''}`;
    const result = useCache(cacheKey, () => DataQueries.costAnalysis(range.from, range.to));
    if (!result) return header + `<p class="hint-text">${esc(t('loading'))}</p>`;
    if (result.__error) return header;

    const allUnits = allUnitsList();
    const unitRows = Object.entries(result.byUnit)
      .map(([key, v]) => {
        const [unitType, unitId] = key.split(':');
        const unit = allUnits.find((u) => u.unit_type === unitType && u.id === unitId);
        const total = v.maintenance + v.repair + v.tire;
        const cpm = v.miles ? total / v.miles : null;
        return { name: unit ? unit.name : key, total, miles: v.miles, cpm };
      })
      .sort((a, b) => b.total - a.total);

    return `
      ${header}
      <div class="overview-grid">
        <div class="stat-card"><span class="stat-label">${esc(t('cost_analysis_maintenance'))}</span><span class="stat-value">${fmtMoney(result.maintenanceCost)}</span></div>
        <div class="stat-card"><span class="stat-label">${esc(t('cost_analysis_repair'))}</span><span class="stat-value">${fmtMoney(result.repairCost)}</span></div>
        <div class="stat-card"><span class="stat-label">${esc(t('cost_analysis_tire'))}</span><span class="stat-value">${fmtMoney(result.tireCost)}</span></div>
        <div class="stat-card"><span class="stat-label">${esc(t('cost_analysis_total'))}</span><span class="stat-value">${fmtMoney(result.totalCost)}</span></div>
        <div class="stat-card"><span class="stat-label">${esc(t('cost_analysis_per_mile'))}</span><span class="stat-value">${result.costPerMile !== null ? fmtMoney(result.costPerMile) : '—'}</span></div>
      </div>
      <p class="hint-text">${esc(t('cost_analysis_per_mile_hint'))}</p>
      <section class="settings-section">
        <h3>${esc(t('cost_analysis_by_unit'))}</h3>
        <table class="data-table">
          <thead><tr><th>${esc(t('unit_name'))}</th><th>${esc(t('maintenance_cost'))}</th><th>${esc(t('mileage_value'))}</th><th>${esc(t('cost_analysis_per_mile'))}</th></tr></thead>
          <tbody>
            ${unitRows.length ? unitRows.map((r) => `
              <tr>
                <td>${esc(r.name)}</td>
                <td>${fmtMoney(r.total)}</td>
                <td>${r.miles !== null ? fmtMiles(r.miles) : '—'}</td>
                <td>${r.cpm !== null ? fmtMoney(r.cpm) : '—'}</td>
              </tr>`).join('') : `<tr><td colspan="4" class="empty-state">${esc(t('maintenance_none'))}</td></tr>`}
          </tbody>
        </table>
      </section>
    `;
  },

  // ---- Fleet-wide metrics: cost-per-mile, vendor spend, trend chart --------
  fleetMetricsPanel() {

  // Small hand-rolled inline SVG bar chart — no charting library needed for
  // one metric over up to 12 months. Colors come from CSS vars so it's
  // correct in both themes automatically.
  costTrendChart(trend) {
    if (!trend.length) return `<p class="empty-state">${esc(t('chart_no_data'))}</p>`;
    const width = 480;
    const height = 180;
    const padding = { top: 10, right: 10, bottom: 34, left: 10 };
    const chartW = width - padding.left - padding.right;
    const chartH = height - padding.top - padding.bottom;
    const max = Math.max(...trend.map((p) => p.total), 1);
    const barW = chartW / trend.length;

    const bars = trend
      .map((p, i) => {
        const barH = Math.max(2, (p.total / max) * chartH);
        const x = padding.left + i * barW + barW * 0.15;
        const y = padding.top + (chartH - barH);
        const w = barW * 0.7;
        const monthLabel = p.month.slice(2).replace('-', '/');
        return `
          <rect x="${x.toFixed(1)}" y="${y.toFixed(1)}" width="${w.toFixed(1)}" height="${barH.toFixed(1)}" rx="2" style="fill:var(--color-accent)">
            <title>${esc(p.month)}: ${fmtMoney(p.total)}</title>
          </rect>
          <text x="${(x + w / 2).toFixed(1)}" y="${height - 10}" text-anchor="middle" class="chart-axis-label">${esc(monthLabel)}</text>
        `;
      })
      .join('');

    return `
      <svg viewBox="0 0 ${width} ${height}" class="trend-chart" role="img" aria-label="${esc(t('chart_cost_over_time'))}">
        <line x1="${padding.left}" y1="${padding.top + chartH}" x2="${width - padding.right}" y2="${padding.top + chartH}" class="chart-axis-line" />
        ${bars}
      </svg>
    `;
  },

  // ==========================================================================
  // Smart file inbox (TZ: "smart function to add files" — upload anything,
  // the system suggests where it belongs, human reviews and confirms).
  // ==========================================================================
  fileInbox() {
    const rows = (AppState.fileInbox && AppState.fileInbox.rows) || [];
    const pending = rows.filter((r) => r.status === 'pending');
    const decided = rows.filter((r) => r.status !== 'pending');

    const unitLabel = (r) => {
      if (!r.suggested_unit_id) return '—';
      const u = getUnitById(r.suggested_unit_type, r.suggested_unit_id);
      return u ? esc(u.name) : '—';
    };
    const categoryLabel = (r) => {
      if (!r.suggested_category_id) return '—';
      const mt = (AppState.maintenanceTypes.rows || []).find((m) => m.id === r.suggested_category_id);
      return mt ? esc(I18n.field(mt, 'name')) : '—';
    };
    // A component-routed suggestion shows the component type instead of a
    // maintenance category, prefixed so it reads distinctly from a regular
    // maintenance-entry suggestion in the same column (see
    // classifyInboxFile/guessComponentTypeFromText in actions.js for how
    // this target gets picked).
    const suggestionLabel = (r) => {
      if (r.detected_kind === 'spreadsheet') {
        return esc(t('inbox_suggested_import')) + ': ' + esc(t('import_entity_' + (r.suggested_import_entity || 'maintenance_entries')));
      }
      if (r.suggested_target === 'component' && r.suggested_component_type_id) {
        const ct = componentTypeById(r.suggested_component_type_id);
        return esc(t('inbox_suggested_component')) + ': ' + (ct ? esc(I18n.field(ct, 'name')) : '—') + ' — ' + unitLabel(r);
      }
      return `${unitLabel(r)} — ${categoryLabel(r)}`;
    };

    const rowHtml = (r) => `
      <tr>
        <td>${esc(r.file_name)}</td>
        <td>${esc(t('inbox_kind_' + r.detected_kind))}</td>
        <td>${fmtDate(r.uploaded_at)}</td>
        <td>${r.status === 'pending' ? suggestionLabel(r) : `${badge(t('inbox_status_' + r.status), r.status === 'filed' ? 'success' : 'muted')}`}</td>
        <td>${r.status === 'pending' && canWrite() ? `<button type="button" class="btn-link" data-action="openInboxReviewForm" data-id="${r.id}">${esc(t('inbox_review_file'))}</button>` : ''}</td>
      </tr>`;

    return `
      <div class="page-header">
        <h1>${esc(t('inbox_title'))}</h1>
        ${canWrite() ? `<button type="button" class="btn btn-primary" data-action="openInboxFilePicker">${esc(t('inbox_add_files'))}</button>` : ''}
      </div>
      <p class="hint-text">${esc(t('inbox_intro'))}</p>
      ${canWrite() ? `
      <div class="inbox-dropzone" data-role="inbox-dropzone">
        <div class="inbox-dropzone-icon" aria-hidden="true">⇩</div>
        <p class="inbox-dropzone-text">${esc(t('inbox_dropzone_text'))}</p>
        <p class="hint-text">${esc(t('inbox_dropzone_hint'))}</p>
      </div>` : ''}
      <input type="file" data-role="inbox-file-input" multiple hidden accept="image/*,.heic,.heif,application/pdf,.xlsx,.xls,.csv,.doc,.docx,.txt,.eml,.msg">
      ${AppState.ui.inboxUploading ? `<p class="form-status form-status-saving">${esc(t('inbox_classifying'))}</p>` : ''}
      <h2>${esc(t('inbox_pending_count'))} (${pending.length})</h2>
      <table class="data-table">
        <thead><tr>
          <th>${esc(t('unit_name'))}</th><th></th><th>${esc(t('inbox_uploaded_at'))}</th><th></th><th></th>
        </tr></thead>
        <tbody>${pending.length ? pending.map(rowHtml).join('') : `<tr><td colspan="5" class="empty-state">${esc(t('inbox_none'))}</td></tr>`}</tbody>
      </table>
      ${decided.length ? `
        <h2>${esc(t('inbox_status_filed'))} / ${esc(t('inbox_status_ignored'))}</h2>
        <table class="data-table">
          <thead><tr><th>${esc(t('unit_name'))}</th><th></th><th>${esc(t('inbox_uploaded_at'))}</th><th></th><th></th></tr></thead>
          <tbody>${decided.map(rowHtml).join('')}</tbody>
        </table>` : ''}
      <div id="modal-root"></div>
    `;
  },

// ---- modal helpers ----------------------------------------------------------
function openModal(html) {
  const root = document.getElementById('modal-root');
  if (!root) return;
  // No data-action on the overlay itself: closest('[data-action]') would
  // otherwise match it for every click inside the modal that isn't a more
  // specific data-action element (e.g. a form's plain submit button),
  // silently closing the modal instead of submitting. Backdrop-click-to-
  // close is handled separately below via a strict e.target === overlay check.
  root.innerHTML = `<div class="modal-overlay">
    <div class="modal-card">
      <button type="button" class="modal-close" data-action="closeModal" aria-label="Close">&times;</button>
      ${html}
    </div>
  </div>`;
}
function closeModal() {
  const root = document.getElementById('modal-root');
  if (root) root.innerHTML = '';
}

function setFormStatus(form, status, message) {
  const el = form.querySelector('[data-role="form-status"]');
  const btn = form.querySelector('button[type="submit"]');
  if (el) {
    el.textContent = message || (status === 'saving' ? I18n.t('saving') : status === 'error' ? I18n.t('save_failed_final') : '');
    el.hidden = !message && status !== 'saving' && status !== 'error';
    el.className = 'form-status form-status-' + status;
  }
  if (btn) btn.disabled = status === 'saving';
}

async function fileToBase64(file) {
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onload = () => resolve(String(reader.result).split(',')[1]);
    reader.onerror = reject;
    reader.readAsDataURL(file);
  });
}

function slugFileName(name) {
  return name.replace(/[^a-zA-Z0-9._-]/g, '_');
}

// ============================================================================
// Bulk import — parsing, header matching, per-row validation, and the
// insert pipeline. Column definitions (IMPORT_CONFIGS) live in views.js
// since the preview table needs them too; everything here is the logic that
// turns raw spreadsheet/pasted rows into either a valid insert payload or a
// skip reason, without ever writing to the database until the user confirms.
// ============================================================================

// Reads a .csv/.xlsx/.xls file into an array of arrays (raw cell values —
// date-formatted cells come back as JS Date objects via cellDates, numbers
// as numbers, everything else as text) using the same SheetJS build already
// loaded for exports.
async function parseSpreadsheetFile(file) {
  const buf = await file.arrayBuffer();
  const wb = XLSX.read(buf, { type: 'array', cellDates: true });
  const sheet = wb.Sheets[wb.SheetNames[0]];
  return XLSX.utils.sheet_to_json(sheet, { header: 1, defval: '' });
}

// Splits text pasted from Excel/Google Sheets (tab-delimited) or a plain
// comma-separated paste into an array of arrays. Minimal CSV-aware quote
// handling for the comma case; tab-delimited pastes never need it.
function parseDelimitedText(text) {
  const lines = text.replace(/\r\n/g, '\n').split('\n').filter((l) => l.trim() !== '');
  if (!lines.length) return [];
  const delim = lines[0].indexOf('\t') !== -1 ? '\t' : ',';
  return lines.map((line) => splitDelimitedLine(line, delim));
}

function splitDelimitedLine(line, delim) {
  if (delim === '\t') return line.split('\t').map((c) => c.trim());
  const out = [];
  let cur = '';
  let inQuotes = false;
  for (let i = 0; i < line.length; i++) {
    const c = line[i];
    if (inQuotes) {
      if (c === '"' && line[i + 1] === '"') { cur += '"'; i++; }
      else if (c === '"') inQuotes = false;
      else cur += c;
    } else if (c === '"') inQuotes = true;
    else if (c === delim) { out.push(cur); cur = ''; }
    else cur += c;
  }
  out.push(cur);
  return out.map((c) => c.trim());
}

function importCellStr(cell) {
  if (cell === null || cell === undefined) return '';
  if (cell instanceof Date) return cell.toISOString().slice(0, 10);
  return String(cell).trim();
}

function importParseDate(cell) {
  if (cell instanceof Date && !isNaN(cell.getTime())) return cell.toISOString().slice(0, 10);
  const s = String(cell || '').trim();
  if (!s) return null;
  let m = s.match(/^(\d{4})-(\d{2})-(\d{2})/);
  if (m) return `${m[1]}-${m[2]}-${m[3]}`;
  m = s.match(/^(\d{1,2})\/(\d{1,2})\/(\d{4})$/);
  if (m) return `${m[3]}-${m[1].padStart(2, '0')}-${m[2].padStart(2, '0')}`;
  const d = new Date(s);
  if (!isNaN(d.getTime())) return d.toISOString().slice(0, 10);
  return null;
}

function importParseNumber(cell) {
  if (typeof cell === 'number') return isNaN(cell) ? null : cell;
  const s = String(cell === null || cell === undefined ? '' : cell).replace(/[,$\s]/g, '').trim();
  if (s === '') return null;
  const n = Number(s);
  return isNaN(n) ? null : n;
}

function normalizeImportHeader(h) {
  return String(h || '').replace(/\(.*?\)/g, '').replace(/\s+/g, ' ').trim().toLowerCase();
}

// Fields trucks and trailers import share (everything but make/model/vin,
// which trucks and trailers handle slightly differently, and beginning_mileage,
// which trailers has no column for at all). Every field here is optional —
// a blank cell is fine — but a non-blank value that fails to parse is a row
// error, same convention as the other import validators.
function importUnitExtraFields(cells) {
  const payload = {};
  if (importCellStr(cells.year) !== '') {
    const year = importParseNumber(cells.year);
    if (year === null) return { error: I18n.t('import_err_bad_number') };
    payload.year = Math.round(year);
  } else {
    payload.year = null;
  }
  payload.plate_number = importCellStr(cells.plate_number) || null;
  payload.insurance_policy_number = importCellStr(cells.insurance_policy_number) || null;
  if (importCellStr(cells.registration_expiration) !== '') {
    const d = importParseDate(cells.registration_expiration);
    if (!d) return { error: I18n.t('import_err_bad_date') };
    payload.registration_expiration = d;
  } else {
    payload.registration_expiration = null;
  }
  if (importCellStr(cells.insurance_expiration) !== '') {
    const d = importParseDate(cells.insurance_expiration);
    if (!d) return { error: I18n.t('import_err_bad_date') };
    payload.insurance_expiration = d;
  } else {
    payload.insurance_expiration = null;
  }
  if (importCellStr(cells.in_service_date) !== '') {
    const d = importParseDate(cells.in_service_date);
    if (!d) return { error: I18n.t('import_err_bad_date') };
    payload.in_service_date = d;
  } else {
    payload.in_service_date = null;
  }
  return { payload };
}

// Matches an uploaded/pasted header row against a config's expected
// columns by name (tolerant of the parenthetical hint being dropped), not
// by position — so column order in the user's file doesn't matter. Returns
// the file-column index for each config column key (-1 if absent) and the
// display names of any missing *required* columns.
function resolveImportColumns(config, headerRow) {
  const normalized = headerRow.map(normalizeImportHeader);
  const colIndexByKey = {};
  const missing = [];
  config.columns.forEach((col) => {
    const aliases = (col.match || [normalizeImportHeader(col.header)]).map((a) => a.toLowerCase());
    const idx = normalized.findIndex((h) => aliases.includes(h));
    colIndexByKey[col.key] = idx;
    if (idx === -1 && col.required) missing.push(col.header);
  });
  return { colIndexByKey, missing };
}

function buildImportRowCells(config, colIndexByKey, rawRow) {
  const cells = {};
  config.columns.forEach((col) => {
    const idx = colIndexByKey[col.key];
    cells[col.key] = idx !== undefined && idx !== -1 ? rawRow[idx] : '';
  });
  return cells;
}

function findUnitByNameOrVin(unitType, key) {
  const list = unitType === 'truck' ? AppState.trucks.rows : AppState.trailers.rows;
  const k = key.trim().toLowerCase();
  if (!k) return null;
  return (
    list.find((u) => (u.vin && u.vin.trim().toLowerCase() === k) || (u.name && u.name.trim().toLowerCase() === k)) || null
  );
}

function findMaintenanceTypeByText(unitType, text) {
  const k = text.trim().toLowerCase();
  if (!k) return null;
  return (
    maintenanceTypesFor(unitType).find(
      (mt) => (mt.name_en && mt.name_en.trim().toLowerCase() === k) || (mt.name_ru && mt.name_ru.trim().toLowerCase() === k)
    ) || null
  );
}

function findVendorByName(name) {
  const k = (name || '').trim().toLowerCase();
  if (!k) return null;
  return (AppState.vendors.rows || []).find((v) => v.name && v.name.trim().toLowerCase() === k) || null;
}

// Insert-or-update a maintenance_intervals row without relying on Postgres
// ON CONFLICT: the table now holds both the org-wide default (unit_id null)
// and per-unit overrides (unit_id set) for the same type_id, enforced by two
// partial unique indexes (see schema.sql) rather than one plain unique
// constraint — Supabase's simple column-list onConflict syntax can't target
// a partial index, so existence is checked against the already-loaded
// maintenanceIntervals LiveTable instead.
async function upsertMaintenanceInterval(patch) {
  const unitId = patch.unit_id || null;
  const existing = (AppState.maintenanceIntervals.rows || []).find(
    (iv) => iv.type_id === patch.type_id && (iv.unit_id || null) === unitId
  );
  if (existing) {
    return DataLayer.withRetry(() => DataLayer.safeUpdate('maintenance_intervals', existing.id, patch));
  }
  return DataLayer.withRetry(() => DataLayer.safeInsert('maintenance_intervals', patch));
}

// One validator per IMPORT_CONFIGS key. Each takes the row's cells (keyed
// by column key, raw values) and returns either { payload } (ready to
// insert, org-stamped automatically by DataLayer.safeInsert) or { error }
// (a translated, human-readable skip reason shown in the preview).
const ImportValidators = {
  trucks(cells) {
    const name = importCellStr(cells.name);
    if (!name) return { error: I18n.t('required_field') };
    const extra = importUnitExtraFields(cells);
    if (extra.error) return { error: extra.error };
    // beginning_mileage exists on trucks only — trailers has no such column,
    // so it's added here rather than inside the shared extra.payload, which
    // both trucks and trailers spread as-is.
    let beginningMileage = null;
    if (importCellStr(cells.beginning_mileage) !== '') {
      beginningMileage = importParseNumber(cells.beginning_mileage);
      if (beginningMileage === null) return { error: I18n.t('import_err_bad_number') };
    }
    return {
      payload: {
        name,
        make: importCellStr(cells.make) || null,
        model: importCellStr(cells.model) || null,
        vin: importCellStr(cells.vin) || null,
        beginning_mileage: beginningMileage !== null ? Math.round(beginningMileage) : null,
        ...extra.payload,
      },
    };
  },

  trailers(cells) {
    const name = importCellStr(cells.name);
    if (!name) return { error: I18n.t('required_field') };
    const extra = importUnitExtraFields(cells);
    if (extra.error) return { error: extra.error };
    return { payload: { name, vin: importCellStr(cells.vin) || null, ...extra.payload } };
  },

  mileage_logs(cells) {
    const truckKey = importCellStr(cells.truck);
    if (!truckKey) return { error: I18n.t('required_field') };
    const truck = findUnitByNameOrVin('truck', truckKey);
    if (!truck) return { error: I18n.t('import_err_unit_not_found') };
    if (!importCellStr(cells.date)) return { error: I18n.t('required_field') };
    const dateStr = importParseDate(cells.date);
    if (!dateStr) return { error: I18n.t('import_err_bad_date') };
    if (importCellStr(cells.mileage) === '') return { error: I18n.t('required_field') };
    const mileage = importParseNumber(cells.mileage);
    if (mileage === null || mileage < 0) return { error: I18n.t('import_err_bad_number') };
    return {
      payload: {
        truck_id: truck.id,
        reading_date: dateStr,
        mileage: Math.round(mileage),
        driver_name: importCellStr(cells.driver) || null,
        note: importCellStr(cells.note) || null,
      },
    };
  },

  maintenance_entries(cells) {
    const unitType = importCellStr(cells.unit_type).toLowerCase();
    if (!unitType) return { error: I18n.t('required_field') };
    if (unitType !== 'truck' && unitType !== 'trailer') return { error: I18n.t('import_err_invalid_unit_type') };
    const unitKey = importCellStr(cells.unit);
    if (!unitKey) return { error: I18n.t('required_field') };
    const unit = findUnitByNameOrVin(unitType, unitKey);
    if (!unit) return { error: I18n.t('import_err_unit_not_found') };
    const typeText = importCellStr(cells.type_of_work);
    if (!typeText) return { error: I18n.t('required_field') };
    const matchedType = findMaintenanceTypeByText(unitType, typeText);
    if (!importCellStr(cells.date)) return { error: I18n.t('required_field') };
    const dateStr = importParseDate(cells.date);
    if (!dateStr) return { error: I18n.t('import_err_bad_date') };
    let mileage = null;
    if (importCellStr(cells.mileage) !== '') {
      mileage = importParseNumber(cells.mileage);
      if (mileage === null) return { error: I18n.t('import_err_bad_number') };
    }
    let cost = null;
    if (importCellStr(cells.cost) !== '') {
      cost = importParseNumber(cells.cost);
      if (cost === null) return { error: I18n.t('import_err_bad_number') };
    }
    let warrantyMonths = null;
    if (importCellStr(cells.warranty_months) !== '') {
      warrantyMonths = importParseNumber(cells.warranty_months);
      if (warrantyMonths === null) return { error: I18n.t('import_err_bad_number') };
    }
    // Cost breakdown (TZ §3: parts/labor/other, falling back to Total Cost
    // alone when a shop's invoice doesn't split it out) — each optional and
    // independently validated, same "blank is fine" rule as warranty_months.
    let partsCost = null;
    if (importCellStr(cells.parts_cost) !== '') {
      partsCost = importParseNumber(cells.parts_cost);
      if (partsCost === null) return { error: I18n.t('import_err_bad_number') };
    }
    let laborCost = null;
    if (importCellStr(cells.labor_cost) !== '') {
      laborCost = importParseNumber(cells.labor_cost);
      if (laborCost === null) return { error: I18n.t('import_err_bad_number') };
    }
    let otherCost = null;
    if (importCellStr(cells.other_cost) !== '') {
      otherCost = importParseNumber(cells.other_cost);
      if (otherCost === null) return { error: I18n.t('import_err_bad_number') };
    }
    const detailText = importCellStr(cells.detail);
    if (matchedType && matchedType.requires_detail && !detailText) {
      return { error: I18n.t('import_err_detail_required') };
    }
    const vendor = findVendorByName(importCellStr(cells.vendor));
    return {
      payload: {
        unit_type: unitType,
        unit_id: unit.id,
        type_id: matchedType ? matchedType.id : null,
        custom_type_text: matchedType ? null : typeText,
        detail_text: detailText || null,
        date_performed: dateStr,
        mileage_at_service: mileage !== null ? Math.round(mileage) : null,
        note: importCellStr(cells.note) || null,
        invoice_number: importCellStr(cells.invoice_number) || null,
        parts_cost: partsCost,
        labor_cost: laborCost,
        other_cost: otherCost,
        cost: cost,
        vendor_id: vendor ? vendor.id : null,
        warranty_months: warrantyMonths !== null ? Math.round(warrantyMonths) : null,
      },
    };
  },

  drivers(cells) {
    const name = importCellStr(cells.name);
    if (!name) return { error: I18n.t('required_field') };
    let cdlExpiration = null;
    if (importCellStr(cells.cdl_expiration) !== '') {
      cdlExpiration = importParseDate(cells.cdl_expiration);
      if (!cdlExpiration) return { error: I18n.t('import_err_bad_date') };
    }
    let medicalExpiration = null;
    if (importCellStr(cells.medical_card_expiration) !== '') {
      medicalExpiration = importParseDate(cells.medical_card_expiration);
      if (!medicalExpiration) return { error: I18n.t('import_err_bad_date') };
    }
    return {
      payload: {
        name,
        phone: importCellStr(cells.phone) || null,
        email: importCellStr(cells.email) || null,
        cdl_number: importCellStr(cells.cdl_number) || null,
        cdl_state: importCellStr(cells.cdl_state) || null,
        cdl_expiration: cdlExpiration,
        medical_card_expiration: medicalExpiration,
        status: 'active',
      },
    };
  },

  fuel_purchases(cells) {
    const truckKey = importCellStr(cells.truck);
    if (!truckKey) return { error: I18n.t('required_field') };
    const truck = findUnitByNameOrVin('truck', truckKey);
    if (!truck) return { error: I18n.t('import_err_unit_not_found') };
    if (!importCellStr(cells.date)) return { error: I18n.t('required_field') };
    const dateStr = importParseDate(cells.date);
    if (!dateStr) return { error: I18n.t('import_err_bad_date') };
    const state = importCellStr(cells.state);
    if (!state) return { error: I18n.t('required_field') };
    if (importCellStr(cells.gallons) === '') return { error: I18n.t('required_field') };
    const gallons = importParseNumber(cells.gallons);
    if (gallons === null || gallons <= 0) return { error: I18n.t('import_err_bad_number') };
    let totalCost = null;
    if (importCellStr(cells.total_cost) !== '') {
      totalCost = importParseNumber(cells.total_cost);
      if (totalCost === null) return { error: I18n.t('import_err_bad_number') };
    }
    let odometer = null;
    if (importCellStr(cells.odometer) !== '') {
      odometer = importParseNumber(cells.odometer);
      if (odometer === null) return { error: I18n.t('import_err_bad_number') };
    }
    return {
      payload: {
        truck_id: truck.id,
        purchase_date: dateStr,
        state_code: state.toUpperCase().slice(0, 2),
        gallons,
        total_cost: totalCost,
        odometer: odometer !== null ? Math.round(odometer) : null,
      },
    };
  },
};

// Turns raw rows (first row = headers) into the preview shown in Settings,
// or a top-level error string if the header row is missing required columns
// entirely. Rows are never inserted here — this is read-only against
// whatever's already loaded in AppState (trucks/trailers/types/vendors).
function computeImportPreview(entityKey, rawRows) {
  const config = IMPORT_CONFIGS[entityKey];
  if (!rawRows || !rawRows.length) return { error: I18n.t('import_no_rows') };
  const headerRow = rawRows[0];
  const { colIndexByKey, missing } = resolveImportColumns(config, headerRow);
  if (missing.length) return { error: I18n.t('import_error_missing_columns', { cols: missing.join(', ') }) };

  const dataRows = rawRows.slice(1).filter((r) => r.some((c) => importCellStr(c) !== ''));
  if (!dataRows.length) return { error: I18n.t('import_no_rows') };

  const rows = dataRows.map((raw) => {
    const cells = buildImportRowCells(config, colIndexByKey, raw);
    const result = ImportValidators[entityKey](cells);
    return {
      display: config.columns.map((col) => importCellStr(cells[col.key])),
      valid: !result.error,
      error: result.error || null,
      payload: result.payload || null,
    };
  });
  return { rows };
}

function applyImportPreview(rawRows) {
  const preview = computeImportPreview(AppState.ui.importState.entityType, rawRows);
  AppState.ui.importState.error = preview.error || null;
  AppState.ui.importState.rows = preview.rows || null;
  AppState.ui.importState.result = null;
  render();
}

  // Only offers positions with no currently-installed tire — moving a tire
  // "onto" an occupied position would require removing that one first,
  // which is its own workflow (openVoidForm), not this one.
  repositionForm(unitType, unitId, tireEventId, fromPosition) {
    const layout = TireDiagrams.layoutFor(unitType);
    const events = (AppState.cache && AppState.cache['tires:' + unitType + ':' + unitId]) || [];
    const occupied = new Set(events.filter((e) => !e.voided_at && e.position_code !== fromPosition).map((e) => e.position_code));
    const options = layout
      .filter((p) => p.code !== fromPosition && !occupied.has(p.code))
      .map((p) => `<option value="${p.code}">${esc(p.code)}</option>`)
      .join('');
    const today = new Date().toISOString().slice(0, 10);
    return `
      <h2>${esc(I18n.t('tire_reposition_title'))}</h2>
      <p class="hint-text">${esc(I18n.t('tire_reposition_hint'))}</p>
      <form data-form="repositionForm" data-unit-type="${unitType}" data-unit-id="${unitId}" data-tire-event-id="${tireEventId}" data-from-position="${fromPosition}">

          <select name="to_position" required>${options || `<option value="">${esc(I18n.t('tire_none_installed'))}</option>`}</select>

        <div class="modal-actions"><span></span><button type="submit" class="btn btn-primary" ${options ? '' : 'disabled'}>${esc(I18n.t('save'))}</button></div>

  // Two shapes depending on what got staged: a spreadsheet routes to the
  // existing bulk-import flow (it already validates row-by-row, so this
  // form doesn't try to re-implement that); anything else gets a small
  // maintenance-entry-style form pre-filled from the suggested unit/category
  // and whatever Gemini/regex extraction found — always editable, since
  // "manual entry always works" applies to this feature too.
  inboxReviewForm(row) {
    const kindLabel = I18n.t('inbox_kind_' + row.detected_kind);
    if (row.detected_kind === 'spreadsheet') {
      return `
        <h2>${esc(I18n.t('inbox_review_file'))}</h2>
        <p class="hint-text">${esc(row.file_name)} — ${esc(kindLabel)}</p>
        <p>${esc(I18n.t('inbox_go_to_import'))}?</p>
        <div class="modal-actions">
          <button type="button" class="btn btn-ghost" data-action="ignoreInboxFile" data-id="${row.id}">${esc(I18n.t('inbox_ignore'))}</button>
          <button type="button" class="btn btn-primary" data-action="openInboxAsImport" data-id="${row.id}">${esc(I18n.t('inbox_go_to_import'))}</button>
        </div>
      `;
    }

    const extracted = row.extracted || {};
    const unitType = row.suggested_unit_type || 'truck';
    const unitOptions = unitOptionsHtml(row.suggested_unit_type, row.suggested_unit_id, 'driver_unassigned');
    const typeOptions = maintenanceTypesFor(unitType)
      .map((mt) => `<option value="${mt.id}" ${row.suggested_category_id === mt.id ? 'selected' : ''}>${esc(I18n.field(mt, 'name'))}</option>`)
      .join('');
    // Component types come from the same unit type as the maintenance
    // categories above — componentTypesFor() already folds in 'both' types
    // (brakes, batteries, suspension, wheel bearings) alongside this unit
    // type's own, exactly like the Components tab's install form does.
    const componentTypeOptions = componentTypesFor(unitType)
      .map((ct) => `<option value="${ct.id}" ${row.suggested_component_type_id === ct.id ? 'selected' : ''}>${esc(I18n.field(ct, 'name'))}</option>`)
      .join('');
    const matchedVendor = extracted.vendor ? findVendorByName(extracted.vendor) : null;
    const today = new Date().toISOString().slice(0, 10);
    const targetIsComponent = row.suggested_target === 'component' && !!row.suggested_component_type_id;
    return `
      <h2>${esc(I18n.t('inbox_review_file'))}</h2>
      <p class="hint-text">${esc(row.file_name)} — ${esc(kindLabel)}</p>
      <p class="hint-text">${esc(I18n.t('inbox_confirm_hint'))}</p>
      <form data-form="inboxReviewForm" data-id="${row.id}">
        <label>${esc(I18n.t('incident_unit'))}<select name="unit">${unitOptions}</select></label>
        <label>${esc(I18n.t('inbox_file_as'))}
          <select name="file_target" data-role="inbox-target-select">
            <option value="maintenance" ${!targetIsComponent ? 'selected' : ''}>${esc(I18n.t('inbox_target_maintenance'))}</option>
            <option value="component" ${targetIsComponent ? 'selected' : ''}>${esc(I18n.t('inbox_target_component'))}</option>
          </select>
        </label>

        <div data-role="inbox-maintenance-fields" ${targetIsComponent ? 'hidden' : ''}>
          <label>${esc(I18n.t('maintenance_type'))}<select name="type_id">${typeOptions}</select></label>
        </div>
        <div data-role="inbox-component-fields" ${targetIsComponent ? '' : 'hidden'}>
          <label>${esc(I18n.t('component_install'))}<select name="component_type_id">${componentTypeOptions}</select></label>
          <label>${esc(I18n.t('component_invoice_number'))}<input type="text" name="invoice_number" value="${esc(extracted.invoice_number || '')}"></label>
          <p class="hint-text">${esc(I18n.t('inbox_component_hint'))}</p>
        </div>

        <label>${esc(I18n.t('maintenance_date'))}<input type="date" name="date_performed" value="${esc(extracted.date || today)}" required></label>
        <label>${esc(I18n.t('maintenance_total_cost_label'))}<input type="number" step="0.01" min="0" name="cost" value="${extracted.cost !== undefined && extracted.cost !== null ? esc(String(extracted.cost)) : ''}"></label>
        <label>${esc(I18n.t('vendor_field'))}<select name="vendor_id">${vendorOptionsHtml(matchedVendor ? matchedVendor.id : null)}</select></label>
        <label>${esc(I18n.t('maintenance_note'))}<textarea name="note">${esc(extracted.description || extracted.vendor || '')}</textarea></label>
        <div class="form-status" data-role="form-status" hidden></div>
        <div class="modal-actions">
          <button type="button" class="btn btn-ghost" data-action="ignoreInboxFile" data-id="${row.id}">${esc(I18n.t('inbox_ignore'))}</button>
          <button type="submit" class="btn btn-primary">${esc(I18n.t('inbox_confirm_file_title'))}</button>
        </div>
      </form>
    `;
  },
};

// ============================================================================
// Event delegation
// ============================================================================
function attachDelegatedEvents(root) {
  root.addEventListener('click', onDelegatedClick);
  root.addEventListener('submit', onDelegatedSubmit);
  root.addEventListener('input', onDelegatedInput);
  root.addEventListener('change', onDelegatedChange);
  root.addEventListener('dragover', onDelegatedDragOver);
  root.addEventListener('dragleave', onDelegatedDragLeave);
  root.addEventListener('drop', onDelegatedDrop);
}

// ---- Smart file inbox drag-and-drop ----------------------------------------
// A plain HTML5 drag/drop sequence: dragover must call preventDefault() or
// the browser refuses to fire 'drop' at all (its default action for a
// dropped file is "navigate to it"). dragenter is deliberately not used —
// dragover fires continuously while hovering, so toggling the highlight
// class there and clearing it on dragleave/drop is enough on its own.
function onDelegatedDragOver(e) {
  const zone = e.target.closest('[data-role="inbox-dropzone"]');
  if (!zone) return;
  e.preventDefault();
  if (e.dataTransfer) e.dataTransfer.dropEffect = 'copy';
  zone.classList.add('inbox-dropzone-active');
}

function onDelegatedDragLeave(e) {
  const zone = e.target.closest('[data-role="inbox-dropzone"]');
  if (!zone) return;
  // The dropzone has child elements (icon, text) that each fire their own
  // dragleave as the pointer crosses into them — only clear the highlight
  // once the pointer has actually left the zone's own bounds.
  if (zone.contains(e.relatedTarget)) return;
  zone.classList.remove('inbox-dropzone-active');
}

function onDelegatedDrop(e) {
  const zone = e.target.closest('[data-role="inbox-dropzone"]');
  if (!zone) return;
  e.preventDefault();
  zone.classList.remove('inbox-dropzone-active');
  const files = Array.from((e.dataTransfer && e.dataTransfer.files) || []);
  if (files.length) Actions.handleInboxFiles(files);
}

function onDelegatedClick(e) {
  const tirePos = e.target.closest('[data-position]');
  if (tirePos && tirePos.closest('[data-role="tire-diagram"]')) {
    const wrap = tirePos.closest('[data-role="tire-diagram"]');
    const unitId = wrap.dataset.unitId;
    const current = AppState.ui.selectedTirePos[unitId];
    const code = tirePos.dataset.position;
    AppState.ui.selectedTirePos[unitId] = current === code ? null : code;
    render();
    return;
  }

  const overlay = e.target.closest('.modal-overlay');
  if (overlay && e.target === overlay) {
    closeModal();
    return;
  }

  const el = e.target.closest('[data-action]');
  if (!el) return;
  const handler = Actions[el.dataset.action];
  if (handler) {
    // Every data-action element manages its own behavior (open a modal, sign
    // out, etc.) — never the browser default, and never a bubble up into an
    // ancestor <a> (unit cards carry a quick-action button inside the link).
    e.preventDefault();
    e.stopPropagation();
    handler(el, e);
  }
}

function onDelegatedInput(e) {
  if (e.target.matches('[data-role="cost-breakdown-input"]')) {
    // Sums whichever breakdown fields the form actually has (maintenance:
    // parts/labor/other; tires: purchase/installation) into the Total Cost
    // field — only once at least one breakdown field has a value, so a form
    // with no split entered at all leaves Total free for direct manual entry
    // ("if a service doesn't split parts/labor, only Total Cost is needed").
    const form = e.target.closest('form');
    const breakdownInputs = Array.from(form.querySelectorAll('[data-role="cost-breakdown-input"]'));
    const anyEntered = breakdownInputs.some((inp) => inp.value !== '');
    if (anyEntered) {
      const total = breakdownInputs.reduce((sum, inp) => sum + (Number(inp.value) || 0), 0);
      const totalField = form.querySelector('[data-role="total-cost-field"]');
      if (totalField) totalField.value = total ? total.toFixed(2) : '';
    }
    return;
  }
  if (e.target.matches('.search-input')) {
    AppState.ui.search = e.target.value;
    render();
    // restore focus + caret since render() replaces the DOM node
    requestAnimationFrame(() => {
      const input = document.querySelector('.search-input');
      if (input) {
        input.focus();
        input.setSelectionRange(input.value.length, input.value.length);
      }
    });
  }
}

function onDelegatedChange(e) {
  if (e.target.matches('[data-role="type-select"]')) {
    const form = e.target.closest('form');
    const isCustom = e.target.value === '__custom__';
    const selectedOption = e.target.options[e.target.selectedIndex];
    const requiresDetail = selectedOption && selectedOption.dataset.requiresDetail === 'true';
    const customWrap = form.querySelector('[data-role="custom-type-wrap"]');
    const detailWrap = form.querySelector('[data-role="detail-wrap"]');
    if (customWrap) customWrap.hidden = !isCustom;
    if (detailWrap) detailWrap.hidden = !requiresDetail;
    return;
  }
  if (e.target.matches('[data-role="inbox-target-select"]')) {
    const form = e.target.closest('form');
    const isComponent = e.target.value === 'component';
    const maintenanceWrap = form.querySelector('[data-role="inbox-maintenance-fields"]');
    const componentWrap = form.querySelector('[data-role="inbox-component-fields"]');
    if (maintenanceWrap) maintenanceWrap.hidden = isComponent;
    if (componentWrap) componentWrap.hidden = !isComponent;
    return;
  }
  if (e.target.matches('[data-role="defects-checkbox"]')) {
    const form = e.target.closest('form');
    const show = e.target.checked;
    ['defect-notes-wrap', 'corrected-wrap', 'mechanic-wrap'].forEach((role) => {
      const wrap = form.querySelector(`[data-role="${role}"]`);
      if (wrap) wrap.hidden = !show;
    });
    return;
  }
  if (e.target.matches('[data-action="switchOrgSelect"]')) {
    switchOrg(e.target.value);
    return;
  }
  if (e.target.matches('[data-action="switchLangSelect"]')) {
    Actions.switchLang(e.target);
    return;
  }
  if (e.target.matches('[data-action="changeImportEntity"]')) {
    Actions.changeImportEntity(e.target);
    return;
  }
  if (e.target.matches('[data-role="import-file-input"]')) {
    Actions.handleImportFileSelected(e.target);
    return;
  }
  if (e.target.matches('[data-action="changeUserRole"]')) {
    Actions.changeUserRole(e.target);
    return;
  }
  if (e.target.matches('[data-action="changeUserCostVisibility"]')) {
    Actions.changeUserCostVisibility(e.target);
    return;
  }
  if (e.target.matches('[data-action="changeAuditLogFilter"]')) {
    Actions.changeAuditLogFilter(e.target);
    return;
  }
  if (e.target.matches('[data-role="inbox-file-input"]')) {
    Actions.handleInboxFilesSelected(e.target);
    return;
  }
  // Generic fallback: any other <select>/checkbox/file input carrying a
  // plain data-action attribute dispatches the same way a click would —
  // added so new "change"-driven controls (report filters, period pickers)
  // don't each need their own explicit branch above.
  const el = e.target.closest('[data-action]');
  if (el && Actions[el.dataset.action]) {
    Actions[el.dataset.action](e.target, e);
  }
}

function onDelegatedSubmit(e) {
  const form = e.target.closest('[data-form]');
  if (!form) return;
  e.preventDefault();
  const handler = Forms[form.dataset.form];
  if (handler) handler(form);
}

    const statusEl = form.querySelector('[data-role="form-status"]');

      statusEl.hidden = false;
      statusEl.textContent = I18n.t('ocr_scanning');
      statusEl.className = 'form-status form-status-saving';
    }
    try {
      const extracted = await GeminiOcr.extract(file);
      if (extracted.cost !== null && extracted.cost !== undefined) {
        const costInput = form.querySelector('[name="cost"]');
        if (costInput) costInput.value = extracted.cost;
      }
      if (extracted.date) {
        const dateInput = form.querySelector('[name="date_performed"], [name="install_date"]');
        if (dateInput) dateInput.value = extracted.date;
      }
      if (extracted.vendor) {
        const noteInput = form.querySelector('[name="note"]');
        if (noteInput && !noteInput.value) noteInput.value = extracted.vendor;
      }
      if (statusEl) {
        statusEl.textContent = I18n.t('ocr_filled');
        statusEl.className = 'form-status form-status-saved';
      }
    } catch (err) {
      console.warn('OCR failed', err);
      if (statusEl) {

    const entityType = AppState.ui.importState.entityType;
    const config = IMPORT_CONFIGS[entityType];
    const headerRow = config.columns.map((c) => c.header);
    const ws = XLSX.utils.aoa_to_sheet([headerRow, config.templateRow]);
    const wb = XLSX.utils.book_new();
    XLSX.utils.book_append_sheet(wb, ws, 'Template');
